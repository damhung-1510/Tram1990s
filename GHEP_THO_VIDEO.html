 Hồ Xuân Hương gọi đó là nỗi cô đơn:", "tts": "[softly] Đêm khuya, có người cũng thức giống bạn. Cụ Hồ Xuân Hương gọi đó là nỗi cô đơn. [long pause]\nĐêm khuya văng vẳng trống canh dồn, [pause]\nTrơ cái hồng nhan với nước non. [pause]\nChén rượu hương đưa say lại tỉnh, [pause]\nVầng trăng bóng xế khuyết chưa tròn, [pause]\nXiên ngang mặt đất, [short pause] rêu từng đám. [pause]\nĐâm toạc chân mây, [short pause] đá mấy hòn. [pause]\nNgán nỗi xuân đi xuân lại lại, [pause]\nMảnh tình san sẻ tí con con.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q035", "kind": "Thơ", "title": "Buồn trông cửa bể chiều hôm", "text": "Buồn trông cửa bể chiều hôm,\nThuyền ai thấp thoáng cánh buồm xa xa?\nBuồn trông ngọn nước mới sa,\nHoa trôi man mác biết là về đâu?\nBuồn trông nội cỏ rầu rầu,\nChân mây mặt đất một màu xanh xanh.\nBuồn trông gió cuốn mặt duềnh,\nẦm ầm tiếng sóng kêu quanh ghế ngồi.", "author": "Nguyễn Du (1766–1820), “Truyện Kiều” (câu 1055–1062)", "note": "buồn, chiều biển", "mood": "co-don", "folders": ["02_Bien-song-nuoc", "04_Hoang-hon-troi-may", "14_Co-don-tram-lang"], "extra": ["03_Mua-tuyet", "05_Dem-thanh-pho", "10_Vu-tru-sao", "13_Mua-cua-so", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": null, "voice": "Nam", "voice_why": "giọng trầm, thơ cổ điển / suy ngẫm", "audio": [], "est": 30, "stem": null, "hook": "Chiều xuống, đứng nhìn biển, ai mà không nhớ nhà? Cụ Nguyễn Du hiểu điều đó:", "tts": "[softly] Chiều xuống, đứng nhìn biển, ai mà không nhớ nhà? Cụ Nguyễn Du hiểu điều đó. [long pause]\nBuồn trông cửa bể chiều hôm, [pause]\nThuyền ai thấp thoáng cánh buồm xa xa? [pause]\nBuồn trông ngọn nước mới sa, [pause]\nHoa trôi man mác biết là về đâu? [pause]\nBuồn trông nội cỏ rầu rầu, [pause]\nChân mây mặt đất một màu xanh xanh. [pause]\nBuồn trông gió cuốn mặt duềnh, [pause]\nẦm ầm tiếng sóng kêu quanh ghế ngồi.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q036", "kind": "Thơ", "title": "Trăm năm trong cõi người ta", "text": "Trăm năm trong cõi người ta,\nChữ tài chữ mệnh khéo là ghét nhau.\nTrải qua một cuộc bể dâu,\nNhững điều trông thấy mà đau đớn lòng.\nLạ gì bỉ sắc tư phong,\nTrời xanh quen thói má hồng đánh ghen.\nCảo thơm lần giở trước đèn,\nPhong tình cổ lục còn truyền sử xanh.", "author": "Nguyễn Du, “Truyện Kiều” (câu 1–8)", "note": "đời người", "mood": "thu-hoai-niem", "folders": ["16_Nguoi-gia-ky-uc"], "extra": ["15_Mua-thu", "19_Suong-mu"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Đánh số câu theo bản Wikisource (3254 câu). Số câu có thể lệch ở các bản khác.", "voice": "Nam", "voice_why": "giọng trầm, thơ cổ điển / suy ngẫm", "audio": [], "est": 30, "stem": null, "hook": "Ngẫm lại một đời, ai chẳng có lúc thấy mình nhỏ bé. Cụ Nguyễn Du mở đầu thế này:", "tts": "[softly] Ngẫm lại một đời, ai chẳng có lúc thấy mình nhỏ bé. Cụ Nguyễn Du mở đầu thế này. [long pause]\nTrăm năm trong cõi người ta, [pause]\nChữ tài chữ mệnh khéo là ghét nhau. [pause]\nTrải qua một cuộc bể dâu, [pause]\nNhững điều trông thấy mà đau đớn lòng. [pause]\nLạ gì bỉ sắc tư phong, [pause]\nTrời xanh quen thói má hồng đánh ghen. [pause]\nCảo thơm lần giở trước đèn, [pause]\nPhong tình cổ lục còn truyền sử xanh.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q037", "kind": "Thơ", "title": "Đôi phen gió tựa, hoa kề", "text": "Đôi phen gió tựa, hoa kề,\nNửa rèm tuyết ngậm, bốn bề trăng thâu.\nCảnh nào cảnh chẳng đeo sầu,\nNgười buồn, cảnh có vui đâu bao giờ!\nĐòi phen nét vẽ, câu thơ,\nCung cầm trong nguyệt, nước cờ dưới hoa,\nVui là vui gượng kẻo mà,\nAi tri âm đó, mặn mà với ai?", "author": "Nguyễn Du, “Truyện Kiều” (câu 1241–1248)", "note": "buồn", "mood": "co-don", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so"], "extra": ["03_Mua-tuyet", "05_Dem-thanh-pho", "10_Vu-tru-sao", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Đánh số câu theo bản Wikisource (3254 câu). Số câu có thể lệch ở các bản khác.", "voice": "Nam", "voice_why": "giọng trầm, thơ cổ điển / suy ngẫm", "audio": [], "est": 30, "stem": null, "hook": "Có những lúc, vui mà chỉ là vui gượng. Cụ Nguyễn Du hiểu điều đó rõ lắm:", "tts": "[softly] Có những lúc, vui mà chỉ là vui gượng. Cụ Nguyễn Du hiểu điều đó rõ lắm. [long pause]\nĐôi phen gió tựa, [short pause] hoa kề, [pause]\nNửa rèm tuyết ngậm, [short pause] bốn bề trăng thâu. [pause]\nCảnh nào cảnh chẳng đeo sầu, [pause]\nNgười buồn, [short pause] cảnh có vui đâu bao giờ. [pause]\nĐòi phen nét vẽ, [short pause] câu thơ, [pause]\nCung cầm trong nguyệt, [short pause] nước cờ dưới hoa, [pause]\nVui là vui gượng kẻo mà, [pause]\nAi tri âm đó, [short pause] mặn mà với ai?", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q038", "kind": "Thơ", "title": "Người lên ngựa kẻ chia bào", "text": "Người lên ngựa kẻ chia bào,\nRừng phong thu đã nhuốm màu quan san.\nDặm hồng bụi cuốn chinh an,\nTrông người đã khuất mấy ngàn dâu xanh.\nNgười về chiếc bóng năm canh,\nKẻ đi muôn dặm một mình xa xôi.\nVầng trăng ai xẻ làm đôi,\nNửa in gối chiếc, nửa soi dặm trường.", "author": "Nguyễn Du, “Truyện Kiều” (câu 1519–1526)", "note": "trăng, xa cách", "mood": "doi-cho", "folders": ["10_Vu-tru-sao", "05_Dem-thanh-pho", "17_Tau-hoa-ga"], "extra": ["02_Bien-song-nuoc"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Đánh số câu theo bản Wikisource (3254 câu). Số câu có thể lệch ở các bản khác.", "voice": "Nữ", "voice_why": "nỗi lòng người phụ nữ, trầm buồn", "audio": [], "est": 30, "stem": null, "hook": "Chia tay nào cũng khó, nhưng khó nhất là lúc người đi đã khuất sau dặm dài. Cụ Nguyễn Du kể:", "tts": "[softly] Chia tay nào cũng khó, nhưng khó nhất là lúc người đi đã khuất sau dặm dài. Cụ Nguyễn Du kể. [long pause]\nNgười lên ngựa kẻ chia bào, [pause]\nRừng phong thu đã nhuốm màu quan san. [pause]\nDặm hồng bụi cuốn chinh an, [pause]\nTrông người đã khuất mấy ngàn dâu xanh. [pause]\nNgười về chiếc bóng năm canh, [pause]\nKẻ đi muôn dặm một mình xa xôi. [pause]\nVầng trăng ai xẻ làm đôi, [pause]\nNửa in gối chiếc, [short pause] nửa soi dặm trường.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 444, "file": "Long-tieng/elevenlabs/Q038_Nguoi-len-ngua-ke-chia-bao.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q040", "kind": "Thơ", "title": "Nước non nặng một lời thề", "text": "Nước non nặng một lời thề,\nNước đi đi mãi không về cùng non.\nNhớ lời nguyện nước thề non,\nNước đi chưa lại, non còn đứng không.\nNon cao những ngóng cùng trông,\nSuối khô dòng lệ chờ mong tháng ngày.\nXương mai một nắm hao gầy,\nTóc mây một mái đã đầy tuyết sương!\nTrời tây ngả bóng tà dương,\nCàng phơi vẻ ngọc nét vàng phôi pha.", "author": "Tản Đà (1889–1939), “Thề non nước” (10 câu đầu / 22 câu)", "note": "chờ đợi, thề nguyền", "mood": "doi-cho", "folders": ["02_Bien-song-nuoc", "01_Thien-nhien"], "extra": ["05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Thề_non_nước_(thơ)", "vnote": "Wikisource ghi nhiều dị bản; dùng cách đọc phổ biến trong SGK: lời, Xương mai, Trời tây ngả bóng. Bản Wikisource chép: nhời, Sương mai, Giời tây chiếu bóng. Dấu câu cuối dòng được chuẩn hoá.", "voice": "Nam", "voice_why": "lời người đàn ông", "audio": [], "est": 35, "stem": null, "hook": "Lời thề ngày ấy, người còn nhớ không? Cụ Tản Đà nhắc giùm bạn đây:", "tts": "[softly] Lời thề ngày ấy, người còn nhớ không? Cụ Tản Đà nhắc giùm bạn đây. [long pause]\nNước non nặng một lời thề, [pause]\nNước đi đi mãi không về cùng non. [pause]\nNhớ lời nguyện nước thề non, [pause]\nNước đi chưa lại, [short pause] non còn đứng không. [pause]\nNon cao những ngóng cùng trông, [pause]\nSuối khô dòng lệ chờ mong tháng ngày. [pause]\nXương mai một nắm hao gầy, [pause]\nTóc mây một mái đã đầy tuyết sương. [pause]\nTrời tây ngả bóng tà dương, [pause]\nCàng phơi vẻ ngọc nét vàng phôi pha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 500, "file": "Long-tieng/elevenlabs/Q040_Nuoc-non-nang-mot-loi-the.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q041", "kind": "Thơ", "title": "Sao anh không về chơi thôn Vĩ?", "text": "Sao anh không về chơi thôn Vĩ?\nNhìn nắng hàng cau nắng mới lên,\nVườn ai mướt quá xanh như ngọc,\nLá trúc che ngang mặt chữ điền.\nGió theo lối gió, mây đường mây,\nDòng nước buồn thiu, hoa bắp lay.\nThuyền ai đậu bến sông trăng đó,\nCó chở trăng về kịp tối nay?\nMơ khách đường xa, khách đường xa,\nÁo em trắng quá nhìn không ra...\nỞ đây sương khói mờ nhân ảnh,\nAi biết tình ai có đậm đà?", "author": "Hàn Mặc Tử (1912–1940), “Đây thôn Vĩ Dạ” (đủ 12 câu, 3 khổ)", "note": "sáng sớm, mong nhớ", "mood": "doi-cho", "folders": ["01_Thien-nhien", "18_Binh-minh-hoang-hon"], "extra": ["02_Bien-song-nuoc", "05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Đây_thôn_Vĩ_Dạ", "vnote": "Wikisource chép từ SGK Ngữ văn 11, NXB Giáo dục, 2007. “sông trăng” viết thường theo bản này. Dấu câu cuối dòng được chuẩn hoá. Q042, Q043 là khổ 2, 3 của cùng bài (đã gộp).", "voice": "Nữ", "voice_why": "lời người con gái / người phụ nữ", "audio": [], "est": 40, "stem": null, "hook": "Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn:", "tts": "[softly] Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn. [long pause]\nSao anh không về chơi thôn Vĩ? [pause]\nNhìn nắng hàng cau nắng mới lên, [pause]\nVườn ai mướt quá xanh như ngọc, [pause]\nLá trúc che ngang mặt chữ điền. [pause]\nGió theo lối gió, [short pause] mây đường mây, [pause]\nDòng nước buồn thiu, [short pause] hoa bắp lay. [pause]\nThuyền ai đậu bến sông trăng đó, [pause]\nCó chở trăng về kịp tối nay? [pause]\nMơ khách đường xa, [short pause] khách đường xa, [pause]\nÁo em trắng quá nhìn không ra. [pause]\nỞ đây không chắc mình có được thấy.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "T05", "kind": "Truyện ngắn 30s", "title": "Cãi nhau", "text": "Ba mẹ mình cãi nhau cả đời. Hồi nhỏ mình sợ lắm. Ngày ba mất, mẹ ngồi im cả buổi, rồi nói nhỏ: giờ nhà yên quá, mẹ lại thấy sợ. Lúc đó mình mới hiểu, còn cãi nhau là còn thương, còn nhau. Im lặng mới là thứ đáng sợ nhất.", "author": "Tự biên (nguyên bản, không vướng bản quyền)", "note": "từng trải", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "20_Cafe-sach-vang", "07_Ca-phe-tra", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Truyện tự biên, đọc kiểu tâm sự, chậm, giọng trầm.", "voice": "Cả hai", "voice_why": "lời kể ngôi thứ nhất, trải đời", "audio": [], "est": 29, "hook": "Ai cũng sợ ba mẹ cãi nhau, cho đến khi trong nhà chỉ còn lại một người:", "tts": "[softly] Ai cũng sợ ba mẹ cãi nhau, cho đến khi trong nhà chỉ còn lại một người. [long pause]\nBa mẹ mình cãi nhau cả đời. [short pause]\nHồi nhỏ mình sợ lắm. [short pause]\nNgày ba mất, mẹ ngồi im cả buổi, rồi nói nhỏ: [pause]\ngiờ nhà yên quá, mẹ lại thấy sợ. [short pause]\nLúc đó mình mới hiểu, còn cãi nhau là còn thương, còn nhau. [short pause]\nIm lặng mới là thứ đáng sợ nhất.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "T06", "kind": "Truyện ngắn 30s", "title": "Bạn thân", "text": "Tuổi hai mươi, mình có cả chục người bạn thân. Qua ba mươi, còn lại hai. Mình từng buồn lắm. Giờ mình hiểu, bạn không mất, chỉ là cuộc đời lọc dần. Ai còn nhắn cho mình lúc mình tệ nhất, người đó mới là bạn. Đừng tiếc người đã đi, hãy giữ chặt người còn ở lại.", "author": "Tự biên (nguyên bản, không vướng bản quyền)", "note": "từng trải", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "20_Cafe-sach-vang", "07_Ca-phe-tra", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Truyện tự biên, đọc kiểu tâm sự, chậm, giọng trầm.", "voice": "Cả hai", "voice_why": "lời kể ngôi thứ nhất, trải đời", "audio": [], "est": 31, "hook": "Lớn lên rồi, bạn bè không mất đi, họ chỉ lặng lẽ rơi dần:", "tts": "[softly] Lớn lên rồi, bạn bè không mất đi, họ chỉ lặng lẽ rơi dần. [long pause]\nTuổi hai mươi, mình có cả chục người bạn thân. [short pause]\nQua ba mươi, còn lại hai. [short pause]\nMình từng buồn lắm. [short pause]\nGiờ mình hiểu, bạn không mất, chỉ là cuộc đời lọc dần. [short pause]\nAi còn nhắn cho mình lúc mình tệ nhất, người đó mới là bạn. [short pause]\nĐừng tiếc người đã đi, hãy giữ chặt người còn ở lại.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "T07", "kind": "Truyện ngắn 30s", "title": "Người cũ", "text": "Mình từng nghĩ chia tay là hết. Hóa ra không. Hết là khi mình thôi kể cho người ta nghe chuyện của mình. Còn thương thì vẫn thương, chỉ là thương mà không nhắn nữa. Người trưởng thành không quên người cũ. Họ chỉ học cách sống chung với cái tên đó.", "author": "Tự biên (nguyên bản, không vướng bản quyền)", "note": "từng trải", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "20_Cafe-sach-vang", "07_Ca-phe-tra", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Truyện tự biên, đọc kiểu tâm sự, chậm, giọng trầm.", "voice": "Cả hai", "voice_why": "lời kể ngôi thứ nhất, trải đời", "audio": [], "est": 29, "hook": "Chia tay xong, người ta có thật sự quên được không?", "tts": "[softly] Chia tay xong, người ta có thật sự quên được không?. [long pause]\nMình từng nghĩ chia tay là hết. [short pause]\nHóa ra không. [short pause]\nHết là khi mình thôi kể cho người ta nghe chuyện của mình. [short pause]\nCòn thương thì vẫn thương, chỉ là thương mà không nhắn nữa. [short pause]\nNgười trưởng thành không quên người cũ. [short pause]\nHọ chỉ học cách sống chung với cái tên đó.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "T08", "kind": "Truyện ngắn 30s", "title": "Tiền và bữa cơm", "text": "Hồi trẻ mình hay nói, tiền không mua được hạnh phúc. Rồi mình nghèo, mình thấy câu đó chỉ đúng với người có tiền. Nhưng có một thứ tiền thật sự không mua được: những buổi chiều có mẹ ngồi chờ ăn cơm cùng. Cứ đi kiếm tiền, nhưng nhớ về ăn cơm.", "author": "Tự biên (nguyên bản, không vướng bản quyền)", "note": "từng trải", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "20_Cafe-sach-vang", "07_Ca-phe-tra", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Truyện tự biên, đọc kiểu tâm sự, chậm, giọng trầm.", "voice": "Cả hai", "voice_why": "lời kể ngôi thứ nhất, trải đời", "audio": [], "est": 29, "hook": "Kiếm tiền để làm gì, nếu quên mất một bữa cơm với mẹ?", "tts": "[softly] Kiếm tiền để làm gì, nếu quên mất một bữa cơm với mẹ?. [long pause]\nHồi trẻ mình hay nói, tiền không mua được hạnh phúc. [short pause]\nRồi mình nghèo, mình thấy câu đó chỉ đúng với người có tiền. [short pause]\nNhưng có một thứ tiền thật sự không mua được: [pause]\nnhững buổi chiều có mẹ ngồi chờ ăn cơm cùng. [short pause]\nCứ đi kiếm tiền, nhưng nhớ về ăn cơm.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "L01", "kind": "Thơ", "title": "Vì em", "text": "Vì em là một bài thơ\nVì em là một giấc mơ khôn cùng\nTôi xin ôm lấy vào lòng\nTôi xin giữ lấy trọn vòng thời gian\nTôi xin sung sướng vô vàn\nĐể ca ngợi, để mơ màng em luôn\nTôi xin dành một chiếc hôn\nĐặt lên tất cả tâm hồn thơ ngây", "author": "Nguyễn Bính (1918–1966)", "note": "tỏ tình, ngọt, hợp thả thính", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Vì_em", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Các cụ nhà ta không nói câu \"anh yêu em\", mà cụ Nguyễn Bính dâng cả một bài thơ thế này:", "tts": "[softly] Các cụ nhà ta không nói câu \"anh yêu em\", mà cụ Nguyễn Bính dâng cả một bài thơ thế này. [long pause]\nVì em là một bài thơ. [pause]\nVì em là một giấc mơ khôn cùng. [pause]\nTôi xin ôm lấy vào lòng. [pause]\nTôi xin giữ lấy trọn vòng thời gian. [pause]\nTôi xin sung sướng vô vàn. [pause]\nĐể ca ngợi, [short pause] để mơ màng em luôn. [pause]\nTôi xin dành một chiếc hôn. [pause]\nĐặt lên tất cả tâm hồn thơ ngây.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L03", "kind": "Thơ", "title": "Lỡ duyên", "text": "Than ôi nàng sắp lấy chồng\nSắp mang pháo đỏ rượu hồng tiễn tôi\nXe hoa sắp đón nàng rồi\nMang nàng về với cuộc đời chồng con\nRiêng tôi sắp sửa đón buồn\nĐể mang tim héo, để hồn hết mơ\nNàng đi còn có bao giờ\nNgoảnh trông lại kẻ se tơ lỡ làng?", "author": "Nguyễn Bính (1918–1966)", "note": "thất tình, người yêu đi lấy chồng", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Lỡ_duyên", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Các cụ nhà ta không đăng trạng thái buồn, mà viết thơ tiễn người yêu đi lấy chồng:", "tts": "[softly] Các cụ nhà ta không đăng trạng thái buồn, mà viết thơ tiễn người yêu đi lấy chồng. [long pause]\nThan ôi nàng sắp lấy chồng. [pause]\nSắp mang pháo đỏ rượu hồng tiễn tôi. [pause]\nXe hoa sắp đón nàng rồi. [pause]\nMang nàng về với cuộc đời chồng con. [pause]\nRiêng tôi sắp sửa đón buồn. [pause]\nĐể mang tim héo, [short pause] để hồn hết mơ. [pause]\nNàng đi còn có bao giờ. [pause]\nNgoảnh trông lại kẻ se tơ lỡ làng?", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L05", "kind": "Thơ", "title": "Tôi còn nhớ lắm", "text": "Tôi còn gì nữa là tôi!\nThuyền quyên nàng vẫn là người thuyền quyên.\nMùa xuân ấy nàng se duyên\nCó đình đổi kiệu, có đèn giăng hoa.\nTóc tôi để bạc cho già\nĐời tôi để rụng cho là đời tôi.\nCòn nên nói nữa hay thôi\nGặp nhau một chuyến đò rồi quên nhau.", "author": "Nguyễn Bính (1918–1966)", "note": "nhớ người cũ, tiếc nuối", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tôi_còn_nhớ_lắm", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Có những người, chia tay rồi mới biết mình còn thương nhiều đến thế. Cụ Nguyễn Bính viết:", "tts": "[softly] Có những người, chia tay rồi mới biết mình còn thương nhiều đến thế. Cụ Nguyễn Bính viết. [long pause]\nTôi còn gì nữa là tôi. [pause]\nThuyền quyên nàng vẫn là người thuyền quyên. [pause]\nMùa xuân ấy nàng se duyên. [pause]\nCó đình đổi kiệu, [short pause] có đèn giăng hoa. [pause]\nTóc tôi để bạc cho già. [pause]\nĐời tôi để rụng cho là đời tôi. [pause]\nCòn nên nói nữa hay thôi. [pause]\nGặp nhau một chuyến đò rồi quên nhau.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L06", "kind": "Thơ", "title": "Nhớ người trong nắng", "text": "Hà Nội có hồ loạn tiếng ve,\nNắng dâng làm lụt cả trưa hè,\nNăm xưa, một buổi đang mưa lụt\nTôi tiễn chân người sang biệt ly.\nTừ buổi về đây, sầu lại sầu\nNgười xa vời quá, ai thương đâu!\nTôi đi ngửa mặt trên hè vắng\nXem những cành cây nó cưới nhau.", "author": "Nguyễn Bính (1918–1966)", "note": "tiễn người, nhớ ngày hè", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Nhớ_người_trong_nắng", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Có những mùa hè bạn nhớ mãi, chỉ vì một người đã không ở lại. Cụ Nguyễn Bính cũng nhớ như thế:", "tts": "[softly] Có những mùa hè bạn nhớ mãi, chỉ vì một người đã không ở lại. Cụ Nguyễn Bính cũng nhớ như thế. [long pause]\nHà Nội có hồ loạn tiếng ve, [pause]\nNắng dâng làm lụt cả trưa hè, [pause]\nNăm xưa, [short pause] một buổi đang mưa lụt. [pause]\nTôi tiễn chân người sang biệt ly. [pause]\nTừ buổi về đây, [short pause] sầu lại sầu. [pause]\nNgười xa vời quá, [short pause] ai thương đâu. [pause]\nTôi đi ngửa mặt trên hè vắng. [pause]\nXem những cành cây nó cưới nhau.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L07", "kind": "Thơ", "title": "Vu quy", "text": "Tháng chạp cho cải hoa vàng\nCho cam da đỏ, cho nàng vu quy\nNàng về mãi xứ bên kia\nCam thôi màu đỏ, bướm chê hoa vàng\nSáng nay sương suống đầy làng\nTưởng như khói pháo đưa nàng năm xưa\nNàng về kẻ đón người đưa\nTôi chờ gì nữa mà chưa giang hồ?\nSông Thương cách mấy lần đò\nChợ Hoàng họp mãi bao giờ cho tan!", "author": "Nguyễn Bính (1918–1966)", "note": "người yêu đi lấy chồng", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Vu_quy", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 35, "hook": "Người yêu đi lấy chồng, các cụ nhà ta không trách móc, chỉ lặng lẽ viết ra thế này:", "tts": "[softly] Người yêu đi lấy chồng, các cụ nhà ta không trách móc, chỉ lặng lẽ viết ra thế này. [long pause]\nTháng chạp cho cải hoa vàng. [pause]\nCho cam da đỏ, [short pause] cho nàng vu quy. [pause]\nNàng về mãi xứ bên kia. [pause]\nCam thôi màu đỏ, [short pause] bướm chê hoa vàng. [pause]\nSáng nay sương suống đầy làng. [pause]\nTưởng như khói pháo đưa nàng năm xưa. [pause]\nNàng về kẻ đón người đưa. [pause]\nTôi chờ gì nữa mà chưa giang hồ? [pause]\nSông Thương cách mấy lần đò. [pause]\nChợ Hoàng họp mãi bao giờ cho tan.", "done": null, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "L08", "kind": "Thơ", "title": "Chân quê (trích)", "text": "Hôm qua em đi tỉnh về,\nĐợi em ở mãi con đê đầu làng.\nKhăn nhung, quần lĩnh rộn ràng,\nÁo cài khuy bấm, em làm khổ tôi!\nNói ra sợ mất lòng em,\nVan em, em hãy giữ nguyên quê mùa.\nNhư hôm em đi lễ chùa,\nCứ ăn mặc thế cho vừa lòng anh!", "author": "Nguyễn Bính (1918–1966); trích, lược khổ giữa", "note": "tình yêu mộc, yêu nguyên bản người ấy", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Chân_quê", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Các cụ nhà ta không chê người yêu quê mùa, mà các cụ năn nỉ: xin em đừng đổi khác!", "tts": "[softly] Các cụ nhà ta không chê người yêu quê mùa, mà các cụ năn nỉ: xin em đừng đổi khác. [long pause]\nHôm qua em đi tỉnh về, [pause]\nĐợi em ở mãi con đê đầu làng. [pause]\nKhăn nhung, [short pause] quần lĩnh rộn ràng, [pause]\nÁo cài khuy bấm, [short pause] em làm khổ tôi. [pause]\nNói ra sợ mất lòng em, [pause]\nVan em, [short pause] em hãy giữ nguyên quê mùa. [pause]\nNhư hôm em đi lễ chùa, [pause]\nCứ ăn mặc thế cho vừa lòng anh.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L09", "kind": "Thơ", "title": "Cô hái mơ", "text": "Thơ thẩn đường chiều một khách thơ\nSay nhìn xa rặng núi xanh lơ\nKhí trời lặng lẽ và trong trẻo\nThấp thoáng rừng mơ cô hái mơ\nHỡi cô con gái hái mơ già\nCô chửa về ư? Đường thì xa\nMà cái thoi ngày như sắp tắt\nHay cô ở lại về cùng ta?", "author": "Nguyễn Bính (1918–1966)", "note": "chạm mặt người lạ, ngỏ lời", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Cô_hái_mơ", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "lời người con trai, tâm tình", "audio": [], "est": 30, "hook": "Các cụ nhà ta không xin số điện thoại, mà các cụ ngỏ lời giữa rừng mơ thế này đây:", "tts": "[softly] Các cụ nhà ta không xin số điện thoại, mà các cụ ngỏ lời giữa rừng mơ thế này đây. [long pause]\nThơ thẩn đường chiều một khách thơ. [pause]\nSay nhìn xa rặng núi xanh lơ. [pause]\nKhí trời lặng lẽ và trong trẻo. [pause]\nThấp thoáng rừng mơ cô hái mơ. [pause]\nHỡi cô con gái hái mơ già. [pause]\nCô chửa về ư? Đường thì xa. [pause]\nMà cái thoi ngày như sắp tắt. [pause]\nHay cô ở lại về cùng ta?", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L10", "kind": "Thơ", "title": "Kiều: đêm thề nguyền", "text": "Vầng trăng vằng vặc giữa trời,\nĐinh ninh hai mặt một lời song song.\nTóc tơ căn vặn tấc lòng,\nTrăm năm tạc một chữ đồng đến xương.\nChén hà sánh giọng quỳnh tương,\nDải là hương lộn bình gương bóng lồng.\nSinh rằng: Gió mát trăng trong,\nBấy lâu nay một chút lòng chưa cam.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "Kim – Kiều thề nguyền", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng:", "tts": "[softly] Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng. [long pause]\nVầng trăng vằng vặc giữa trời, [pause]\nĐinh ninh hai mặt một lời song song. [pause]\nTóc tơ căn vặn tấc lòng, [pause]\nTrăm năm tạc một chữ đồng đến xương. [pause]\nChén hà sánh giọng quỳnh tương, [pause]\nDải là hương lộn bình gương bóng lồng. [pause]\nSinh rằng: Gió mát trăng trong, [pause]\nBấy lâu nay một chút lòng chưa cam.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 415, "file": "Long-tieng/elevenlabs/L10_Kieu-dem-the-nguyen.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L11", "kind": "Thơ", "title": "Kiều: lần đầu gặp Kim Trọng", "text": "Người quốc sắc, kẻ thiên tài,\nTình trong như đã, mặt ngoài còn e.\nChập chờn cơn tỉnh cơn mê.\nRốn ngồi chẳng tiện, dứt về chỉn khôn.\nBóng tà như giục cơn buồn,\nKhách đà lên ngựa, người còn nghé theo.\nDưới cầu nước chảy trong veo,\nBên cầu tơ liễu bóng chiều thướt tha.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "gặp là nhớ, hợp hook \"một ánh nhìn\"", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này:", "tts": "[softly] Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này. [long pause]\nNgười quốc sắc, [short pause] kẻ thiên tài, [pause]\nTình trong như đã, [short pause] mặt ngoài còn e. [pause]\nChập chờn cơn tỉnh cơn mê. [pause]\nRốn ngồi chẳng tiện, [short pause] dứt về chỉn khôn. [pause]\nBóng tà như giục cơn buồn, [pause]\nKhách đà lên ngựa, [short pause] người còn nghé theo. [pause]\nDưới cầu nước chảy trong veo, [pause]\nBên cầu tơ liễu bóng chiều thướt tha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 488, "file": "Long-tieng/elevenlabs/L11_Kieu-lan-dau-gap-Kim-Trong.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C01", "kind": "Ca dao", "title": "Hôm qua tát nước đầu đình", "text": "Hôm qua tát nước đầu đình,\nBỏ quên cái áo trên cánh hoa sen,\nEm được thì cho anh xin,\nHay là em để làm tin trong nhà.\nÁo anh sứt chỉ đường tà,\nVợ anh chưa có, mẹ già chưa khâu.\nÁo anh sứt chỉ đã lâu,\nMai mượn cô ấy vào khâu cho cùng.", "author": "Ca dao (Nguyễn Văn Ngọc / Wikisource)", "note": "trích 8 dòng đầu", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Con_trai_ngỏ_ý_với_con_gái", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Các cụ nhà ta không nhắn \"em có người yêu chưa\", mà bỏ quên cái áo trên cành hoa sen:", "tts": "[softly] Các cụ nhà ta không nhắn \"em có người yêu chưa\", mà bỏ quên cái áo trên cành hoa sen. [long pause]\nHôm qua tát nước đầu đình, [pause]\nBỏ quên cái áo trên cánh hoa sen, [pause]\nEm được thì cho anh xin, [pause]\nHay là em để làm tin trong nhà. [pause]\nÁo anh sứt chỉ đường tà, [pause]\nVợ anh chưa có, [short pause] mẹ già chưa khâu. [pause]\nÁo anh sứt chỉ đã lâu, [pause]\nMai mượn cô ấy vào khâu cho cùng.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C02", "kind": "Ca dao", "title": "Vào vườn hái quả cau xanh", "text": "Vào vườn hái quả cau xanh,\nBổ ra làm sáu, mời anh xơi trầu.\nTrầu này têm những vôi tàu,\nGiữa đệm cát cánh, hai đầu quế cay.\nTrầu này ăn thiệt là say,\nDù mặn, dù nhạt, dù cay, dù nồng.\nDù chăng nên đạo vợ chồng.\nXơi dăm ba miếng kẻo lòng nhớ thương!", "author": "Ca dao (Wikisource)", "note": "8 dòng", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Con_gái_ngỏ_ý_với_con_trai", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương:", "tts": "[softly] Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương. [long pause]\nVào vườn hái quả cau xanh, [pause]\nBổ ra làm sáu, [short pause] mời anh xơi trầu. [pause]\nTrầu này têm những vôi tàu, [pause]\nGiữa đệm cát cánh, [short pause] hai đầu quế cay. [pause]\nTrầu này ăn thiệt là say, [pause]\nDù mặn, [short pause] dù nhạt, [short pause] dù cay, [short pause] dù nồng. [pause]\nDù chăng nên đạo vợ chồng. [pause]\nXơi dăm ba miếng kẻo lòng nhớ thương.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 480, "file": "Long-tieng/elevenlabs/C02_Vao-vuon-hai-qua-cau-xanh.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C03", "kind": "Ca dao", "title": "Trèo lên cây bưởi hái hoa", "text": "Trèo lên cây bưởi hái hoa,\nBước xuống vườn cà hái nụ tầm-xuân.\nBa đồng một mớ trầu cay,\nSao anh chẳng hỏi những ngày còn không?\nBây giờ em đã có chồng,\nNhư chim vào lồng, như cá cắn câu.\nCá cắn câu, biết đâu mà gỡ;\nChim vào lồng, biết thuở nào ra!", "author": "Ca dao (Wikisource)", "note": "đã bỏ một dòng khuyết trên trang nguồn", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tiếc_sự_biết_nhau_quá_chậm", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này:", "tts": "[softly] Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này. [long pause]\nTrèo lên cây bưởi hái hoa, [pause]\nBước xuống vườn cà hái nụ tầm-xuân. [pause]\nBa đồng một mớ trầu cay, [pause]\nSao anh chẳng hỏi những ngày còn không? [pause]\nBây giờ em đã có chồng, [pause]\nNhư chim vào lồng, [short pause] như cá cắn câu. [pause]\nCá cắn câu, [short pause] biết đâu mà gỡ, [pause]\nChim vào lồng, [short pause] biết thuở nào ra.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 438, "file": "Long-tieng/elevenlabs/C03_Treo-len-cay-buoi-hai-hoa.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C04", "kind": "Ca dao", "title": "Đôi duyên ta như loan với phượng", "text": "Đôi duyên ta như loan với phượng,\nNỡ lòng nào để phượng lìa cây.\nMuốn cho có đó có đây,\nAi làm nên nỗi nước này, chàng ôi!\nThà rằng chẳng biết thì thôi,\nBiết chi gối chiếc lẻ-loi thêm phiền.", "author": "Ca dao (Wikisource)", "note": "6 dòng", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Nỗi_ly_biệt", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này:", "tts": "[softly] Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này. [long pause]\nĐôi duyên ta như loan với phượng, [pause]\nNỡ lòng nào để phượng lìa cây. [pause]\nMuốn cho có đó có đây, [pause]\nAi làm nên nỗi nước này, [short pause] chàng ôi. [pause]\nThà rằng chẳng biết thì thôi, [pause]\nBiết chi gối chiếc lẻ-loi thêm phiền.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 339, "file": "Long-tieng/elevenlabs/C04_Doi-duyen-ta-nhu-loan-voi-phuong.mp3", "date": "2026-10-16"}, "tpl": "Thơ Hoài Cổ"}, {"id": "N01", "kind": "Thơ", "title": "Lòng mẹ", "text": "Gái lớn ai không phải lấy chồng\nCan gì mà khóc, nín đi không!\nNín đi, mặc áo ra chào họ\nRõ quí con tôi! Các chị trông!\nĐưa con ra đến cửa buồng thôi\nMẹ phải xa con, khổ mấy mươi!\nCon ạ! Đêm nay mình mẹ khóc\nĐêm đêm mình mẹ lại đưa thoi", "author": "Nguyễn Bính (1918–1966); trích, lược 3 khổ giữa", "note": "dị bản chữ ở dòng \"Đêm nay\"", "mood": "me", "folders": ["16_Nguoi-gia-ky-uc", "13_Mua-cua-so", "14_Co-don-tram-lang"], "extra": ["07_Ca-phe-tra", "20_Cafe-sach-vang", "17_Tau-hoa-ga", "04_Hoang-hon-troi-may", "Chill_100_9x16/01_Mua"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Lòng_mẹ", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Mẹ không nói yêu thương, mẹ chỉ dỗ con gái đừng khóc ngày về nhà chồng, rồi một mình khóc cả đêm. Cụ Nguyễn Bính viết:", "tts": "[softly] Mẹ không nói yêu thương, mẹ chỉ dỗ con gái đừng khóc ngày về nhà chồng, rồi một mình khóc cả đêm. Cụ Nguyễn Bính viết. [long pause]\nGái lớn ai không phải lấy chồng. [pause]\nCan gì mà khóc, [short pause] nín đi không. [pause]\nNín đi, [short pause] mặc áo ra chào họ. [pause]\nRõ quí con tôi, [short pause] các chị trông. [pause]\nĐưa con ra đến cửa buồng thôi. [pause]\nMẹ phải xa con, [short pause] khổ mấy mươi. [pause]\nCon ạ, [short pause] đêm nay mình mẹ khóc. [pause]\nĐêm đêm mình mẹ lại đưa thoi.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "N02", "kind": "Thơ", "title": "Tết của mẹ tôi", "text": "Tết đến me tôi vất vả nhiều,\nMe tôi lo liệu đủ trăm chiều.\nSân gạch tường hoa, người quét lại\nVẽ cung trừ quỷ, trồng cây nêu.\nXong ba ngày tết me tôi lại\nĐầu tắt, mặt tối, nuôi chồng con,\nRồi một đôi khi người giã gạo,\nChuyện trò kể lại tuổi chân son.", "author": "Nguyễn Bính (1918–1966); trích khổ đầu và khổ cuối", "note": "tác giả viết \"me\" theo giọng Bắc xưa", "mood": "me", "folders": ["16_Nguoi-gia-ky-uc", "13_Mua-cua-so", "14_Co-don-tram-lang"], "extra": ["07_Ca-phe-tra", "20_Cafe-sach-vang", "17_Tau-hoa-ga", "04_Hoang-hon-troi-may", "Chill_100_9x16/01_Mua"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tết_của_me_tôi", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Ngày Tết, mẹ vất vả nhất, mà chẳng ai nhớ cảm ơn mẹ. Cụ Nguyễn Bính nhớ mẹ như thế này:", "tts": "[softly] Ngày Tết, mẹ vất vả nhất, mà chẳng ai nhớ cảm ơn mẹ. Cụ Nguyễn Bính nhớ mẹ như thế này. [long pause]\nTết đến me tôi vất vả nhiều, [pause]\nMe tôi lo liệu đủ trăm chiều. [pause]\nSân gạch tường hoa, [short pause] người quét lại. [pause]\nVẽ cung trừ quỷ, [short pause] trồng cây nêu. [pause]\nXong ba ngày tết me tôi lại. [pause]\nĐầu tắt, [short pause] mặt tối, [short pause] nuôi chồng con, [pause]\nRồi một đôi khi người giã gạo, [pause]\nChuyện trò kể lại tuổi chân son.", "done": null, "tpl": "Chạy Chữ 2 Trang"}, {"id": "N03", "kind": "Thơ", "title": "Thư gửi thày mẹ (khổ 1)", "text": "Con đi năm ấy tháng tư\nLúa chiêm xấp xỉ giỗ từ tháng ba.\nCon đi quạnh cửa, quạnh nhà\nCha già đập lúa, mẹ già rũ rơm.\nCha giã gạo, mẹ thổi cơm\nCó con, con vắng, ai làm thay cho?", "author": "Nguyễn Bính (1918–1966); trích", "note": "trích 6 dòng", "mood": "me", "folders": ["16_Nguoi-gia-ky-uc", "13_Mua-cua-so", "14_Co-don-tram-lang"], "extra": ["07_Ca-phe-tra", "20_Cafe-sach-vang", "17_Tau-hoa-ga", "04_Hoang-hon-troi-may", "Chill_100_9x16/01_Mua"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Thư_gửi_thày_mẹ", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nam", "voice_why": "giọng đọc  $('#list').innerHTML=ps.map(p=>{
  let v='';
  if(p.exact){const rel=p.exact;v+=`<div><small>Clip đã gắn sẵn:</small> <a href="#" data-copy="${esc(rel)}">${esc(rel)}</a> <button class="act" data-open="${esc(rel)}">▶ mở</button></div>
   <div><small>Văn bản / SRT:</small> <a href="Thơ/Tho_CaDao_Co_Nguon/Van_ban/${p.stem}.txt" target="_blank">txt</a> · <a href="Thơ/Tho_CaDao_Co_Nguon/Phu_de_SRT/${p.stem}.srt" target="_blank">srt</a></div>`}
  const fl=p.folders.map(f=>`<button class="f" data-f="${f}" data-p="${p.id}">${f} (${clipList(f).length})</button>`).join('');
  const ex=p.extra.map(f=>`<button class="f x" data-f="${f}" data-p="${p.id}">${f.replace('Chill_100_9x16/','Chill/')} (${clipList(f).length})</button>`).join('');
  if(fl)v+=`<div><small>Thư mục video gợi ý:</small> ${fl}</div>`;
  if(ex)v+=`<div><small>${p.exact?'Hoặc chọn clip khác cùng mood:':'Thêm cùng mood:'}</small> ${ex}</div>`;
  const ms=musicFor(p.mood);
  if(ms.length)v+=`<div><small>Nhạc nền hợp mood (${ms.length} bài):</small> <button class="act" data-music="${p.id}">🎵 Chọn nhạc ngẫu nhiên</button> <button class="f" data-all="${p.id}">xem tất cả</button></div><div id="m_${p.id}"></div>`;
  v+=`<div class="row"><button class="act" data-rand="${p.id}">🎲 Chọn clip ngẫu nhiên</button></div><div id="o_${p.id}"></div>`;
  return `<div class="card${used[p.id]?' used':''}"><div class="hd"><span class="id">${p.id}</span>${p.done?`<span class="tag" style="background:#2f7d4f;color:#fff">✅ Đã lồng tiếng</span>`:''}${p.tpl?`<span class="tag" style="background:transparent;border:1px solid var(--acc)">📄 ${p.tpl}</span>`:''}<span>${p.kind}</span><span class="tag">${D.moods[p.mood]}</span><span class="tag">🎙 ${p.voice}</span><span class="tag" style="background:${p.est>=28?'var(--accbg)':'transparent'};border:1px solid var(--acc)">≈ ${p.est}s${p.est<28?' (ngắn)':''}</span><span>${esc(p.note)}</span><label style="margin-left:auto"><input type="checkbox" data-u="${p.id}"${used[p.id]?' checked':''}> đã làm video</label></div>
  ${p.hook?`<div class="tx" style="font-size:15px;color:var(--acc);margin-bottom:2px">🎬 Mở đầu (≈10s): ${esc(p.hook)}</div>`:''}<div class="tx">${esc(p.text)}</div>${p.tts?`<div class="au"><a href="#" data-copy="${esc(p.tts)}">sao chép kịch bản ElevenLabs (mở đầu + thơ)</a></div>`:''}<div class="au">— ${esc(p.author)}${p.items?' (các mã trong tab Thơ)':''}${p.url?` · <a href="${p.url}" target="_blank">nguồn</a>`:''}</div>${p.vnote?`<div class="au" style="font-size:12px">${esc(p.vnote)}</div>`:''}<div class="au">Giọng đọc gợi ý: <b>${p.voice}</b> — ${esc(p.voice_why)}</div><div class="vd">${(p.audio||[]).map(a=>`<div class="mu"><b>🔊 ${esc(a.voice)}</b><small>${a.dur}s</small><audio controls preload="none" src="${encodeURI(a.file)}"></audio> <a href="#" data-copy="${esc(a.file)}">sao chép đường dẫn</a></div>`).join('')}${v}</div></div>`}).join('');
}
function showClips(pid,f){
 const o=$('#o_'+pid);o.innerHTML=`<div class="cl">${clipList(f).map(c=>`<div data-copy="Videos/${esc(f)}/${esc(c)}">${esc(c)}</div>`).join('')}</div>`}
function pick(p){
 const pool=[];p.folders.concat(p.extra.length&&!p.folders.length?p.extra:[]).forEach(f=>clipList(f).forEach(c=>pool.push('Videos/'+f+'/'+c)));
 if(p.exact&&!pool.length)pool.push(p.exact);
 if(p.exact)p.extra.forEach(f=>clipList(f).forEach(c=>pool.push('Videos/'+f+'/'+c)));
 const r=pool[Math.floor(Math.random()*pool.length)];
 $('#o_'+p.id).innerHTML=`<div class="pick">${esc(r)}</div>`;copy(r)}
function copy(rel){try{navigator.clipboard.writeText(BASE+rel)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-k],[data-f],[data-rand],[data-copy],[data-open],[data-t],[data-v],[data-play],[data-music],[data-all]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;mood='';kind='';voice='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#kinds').style.display=$('#voices').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#unusedl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#longl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#kinds').style.display=$('#voices').style.display=((tab=='tho'||tab=='dub')||tab=='bo')?'':'none';if(tab=='bo')$('#kinds').style.display='none';render()}
 else if(t.dataset.v){voice=voice==t.dataset.v?'':t.dataset.v;render()}
 else if(t.dataset.play)play(t.dataset.play,t.dataset.pk);
 else if(t.dataset.music){const p=findP(p=>p.id==t.dataset.music),ts=musicFor(p.mood),x=ts[Math.floor(Math.random()*ts.length)];$('#m_'+p.id).innerHTML=musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`}
 else if(t.dataset.all){const p=findP(p=>p.id==t.dataset.all);$('#m_'+p.id).innerHTML=musicFor(p.mood).map(x=>musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`).join('')}
 else if(t.dataset.m!==undefined){mood=t.dataset.m;render()}
 else if(t.dataset.k){kind=kind==t.dataset.k?'':t.dataset.k;render()}
 else if(t.dataset.f)showClips(t.dataset.p,t.dataset.f);
 else if(t.dataset.rand)pick(findP(p=>p.id==t.dataset.rand));
 else if(t.dataset.open)window.open(encodeURI(t.dataset.open));
 else if(t.dataset.copy){e.preventDefault();copy(t.dataset.copy);t.style.color='var(--acc)'}});
document.addEventListener('change',e=>{if(e.target.dataset.u){used[e.target.dataset.u]=e.target.checked;save();render()}});
$('#q').oninput=render;$('#unused').onchange=render;$('#long30').onchange=render;render();
</script><script src="tao-video.js"></script></body></html>
