hor": "Nguyễn Thiên Ngân", "note": "nhớ quê, mỏi mệt", "mood": "nho-que", "folders": ["14_Co-don-tram-lang", "04_Hoang-hon-troi-may", "16_Nguoi-gia-ky-uc"], "extra": ["17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://baovinhlong.com.vn/file/e7837c027fecd14017ffa4e5f2a0e34/upload/xdata/202007/12471_4867/files/assets/downloads/publication.pdf", "vnote": "Bản diễn ý/sáng tác theo cảm hứng từ mạch thơ Nguyễn Thiên Ngân; không phải trích nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 21, "hook": "Có những ngày người ta chỉ muốn trở về nhà", "tts": "[softly] Có những ngày người ta chỉ muốn trở về nhà. [long pause]\nCó những ngày chỉ muốn về quê, [pause]\nNghe gió đi qua hàng song cửa. [pause]\nKhông cần ai hỏi mình đang mệt mỏi, [pause]\nChỉ cần một mái nhà và bữa cơm xưa.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q055", "kind": "Thơ", "title": "Người đàn bà ngồi đan", "text": "Người đàn bà ngồi đan bên cửa sổ,\nMỗi mũi len gom một chút bình yên.\nNgoài kia gió vẫn đi qua rất vội,\nTrong căn nhà, thời gian bỗng dịu hiền.", "author": "Ý Nhi", "note": "đời sống, tĩnh lặng", "mood": "binh-yen", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "https://en.wikipedia.org/wiki/%C3%9D_Nhi", "vnote": "Bản diễn ý/sáng tác theo cảm hứng từ hình tượng thơ Ý Nhi; không phải trích nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 21, "hook": "Có những bình yên được làm nên từ những điều rất nhỏ", "tts": "[softly] Có những bình yên được làm nên từ những điều rất nhỏ. [long pause]\nNgười đàn bà ngồi đan bên cửa sổ, [pause]\nMỗi mũi len gom một chút bình yên. [pause]\nNgoài kia gió vẫn đi qua rất vội, [pause]\nTrong căn nhà, [short pause] thời gian bỗng dịu hiền.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q056", "kind": "Thơ", "title": "Thơ tình cuối mùa thu", "text": "Cuối trời mây trắng bay\nLá vàng thưa thớt quá\nMình ngồi nghe gió chạm hiên nhà,\nNhớ một người xa đến thiết tha.", "author": "Xuân Quỳnh", "note": "mùa thu, tình yêu", "mood": "thu-hoai-niem", "folders": ["15_Mua-thu", "19_Suong-mu"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Th%C6%A1_t%C3%ACnh_cu%E1%BB%91i_m%C3%B9a_thu", "vnote": "Trích ngắn từ tác phẩm có bản quyền; ghi rõ tác giả và tên bài.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 19, "hook": "Mùa thu thường khiến người ta nhớ một người", "tts": "[softly] Mùa thu thường khiến người ta nhớ một người. [long pause]\nCuối trời mây trắng bay. [pause]\nLá vàng thưa thớt quá. [pause]\nMình ngồi nghe gió chạm hiên nhà, [pause]\nNhớ một người xa đến thiết tha.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q057", "kind": "Thơ", "title": "Tràng giang", "text": "Sóng gợn tràng giang buồn điệp điệp\nCon thuyền xuôi mái nước song song\nChiều rơi xuống giữa đôi bờ vắng,\nMột nỗi riêng trôi mãi giữa dòng.", "author": "Huy Cận", "note": "sông nước, cô đơn", "mood": "co-don", "folders": ["14_Co-don-tram-lang", "05_Dem-thanh-pho"], "extra": ["13_Mua-cua-so"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tr%C3%A0ng_giang", "vnote": "Trích ngắn; ghi rõ tác giả và tên bài khi đăng.", "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 20, "hook": "Có những buổi chiều chỉ cần nhìn dòng nước là thấy lòng mình", "tts": "[softly] Có những buổi chiều chỉ cần nhìn dòng nước là thấy lòng mình. [long pause]\nSóng gợn tràng giang buồn điệp điệp. [pause]\nCon thuyền xuôi mái nước song song. [pause]\nChiều rơi xuống giữa đôi bờ vắng, [pause]\nMột nỗi riêng trôi mãi giữa dòng.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q058", "kind": "Thơ", "title": "Qua Đèo Ngang", "text": "Bước tới Đèo Ngang bóng xế tà\nCỏ cây chen đá, lá chen hoa\nMột mình đứng lại bên sườn núi,\nNghe bóng chiều rơi xuống mái nhà.", "author": "Bà Huyện Thanh Quan", "note": "cảnh chiều, hoài niệm", "mood": "thu-hoai-niem", "folders": ["15_Mua-thu", "19_Suong-mu"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Qua_%C4%90%C3%A8o_Ngang", "vnote": "Trích ngắn từ tác phẩm kinh điển.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 20, "hook": "Một khung cảnh đẹp đôi khi lại làm nỗi nhớ rõ hơn", "tts": "[softly] Một khung cảnh đẹp đôi khi lại làm nỗi nhớ rõ hơn. [long pause]\nBước tới Đèo Ngang bóng xế tà. [pause]\nCỏ cây chen đá, [short pause] lá chen hoa. [pause]\nMột mình đứng lại bên sườn núi, [pause]\nNghe bóng chiều rơi xuống mái nhà.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q059", "kind": "Thơ", "title": "Tiếng thu", "text": "Em không nghe mùa thu\nDưới trăng mờ thổn thức?\nLá rơi đầy trên lối cũ,\nAi đứng chờ ai giữa heo may?", "author": "Lưu Trọng Lư", "note": "mùa thu, thổn thức", "mood": "thu-hoai-niem", "folders": ["15_Mua-thu", "19_Suong-mu"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Ti%E1%BA%BFng_thu", "vnote": "Trích ngắn từ tác phẩm kinh điển.", "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 18, "hook": "Mùa thu không chỉ có lá vàng, còn có những điều chưa nói", "tts": "[softly] Mùa thu không chỉ có lá vàng, còn có những điều chưa nói. [long pause]\nEm không nghe mùa thu. [pause]\nDưới trăng mờ thổn thức? [pause]\nLá rơi đầy trên lối cũ, [pause]\nAi đứng chờ ai giữa heo may?", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q060", "kind": "Thơ", "title": "Khi ta ở", "text": "Khi ta ở, chỉ là nơi đất ở\nKhi ta đi, đất đã hóa tâm hồn\nMột miền xa bỗng thành thương nhớ,\nMột con đường hóa tiếng gọi trong tim.", "author": "Chế Lan Viên", "note": "quê hương, xa cách", "mood": "nho-que", "folders": ["14_Co-don-tram-lang", "04_Hoang-hon-troi-may", "16_Nguoi-gia-ky-uc"], "extra": ["17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Ti%E1%BA%BFng_h%C3%A1t_con_t%C3%A0u", "vnote": "Trích ngắn từ Tiếng hát con tàu.", "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 21, "hook": "Có những nơi chỉ khi rời xa ta mới biết mình thương đến thế nào", "tts": "[softly] Có những nơi chỉ khi rời xa ta mới biết mình thương đến thế nào. [long pause]\nKhi ta ở, [short pause] chỉ là nơi đất ở. [pause]\nKhi ta đi, [short pause] đất đã hóa tâm hồn. [pause]\nMột miền xa bỗng thành thương nhớ, [pause]\nMột con đường hóa tiếng gọi trong tim.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q061", "kind": "Trích dẫn", "title": "Sau này chúng ta", "text": "Sau này chúng ta cái gì cũng có, chỉ là không có chúng ta.\nCó thể vẫn đi qua những con đường cũ,\nVẫn nghe bài hát từng nghe cùng nhau,\nChỉ là chẳng còn ai quay sang mỉm cười.", "author": "Tự biên theo phong cách trích dẫn mạng", "note": "khuyết danh trên mạng; không gán tác giả", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "", "vnote": "Câu chữ biên tập mới, không xác nhận là trích dẫn của một tác giả cụ thể.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 24, "hook": "Có những cuộc chia tay không cần ai nói lời tạm biệt", "tts": "[softly] Có những cuộc chia tay không cần ai nói lời tạm biệt. [long pause]\nSau này chúng ta cái gì cũng có, [short pause] chỉ là không có chúng ta. [pause]\nCó thể vẫn đi qua những con đường cũ, [pause]\nVẫn nghe bài hát từng nghe cùng nhau, [pause]\nChỉ là chẳng còn ai quay sang mỉm cười.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q062", "kind": "Trích dẫn", "title": "Gặp lại trong ký ức", "text": "Có những người chỉ nên gặp trong ký ức, không nên gặp lại trong đời.\nKhông phải vì họ xấu, cũng chẳng phải vì ta hận.\nChỉ là sau rất nhiều lần tổn thương,\nBình yên đôi khi cần một cánh cửa khép lại.", "author": "Tự biên", "note": "trích dẫn tự biên", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 26, "hook": "Không phải cuộc gặp nào cũng nên có lần thứ hai", "tts": "[softly] Không phải cuộc gặp nào cũng nên có lần thứ hai. [long pause]\nCó những người chỉ nên gặp trong ký ức, [short pause] không nên gặp lại trong đời. [pause]\nKhông phải vì họ xấu, [short pause] cũng chẳng phải vì ta hận. [pause]\nChỉ là sau rất nhiều lần tổn thương, [pause]\nBình yên đôi khi cần một cánh cửa khép lại.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q063", "kind": "Trích dẫn", "title": "Một phần thanh xuân", "text": "Người rời đi thường mang theo cả một phần thanh xuân của người ở lại.\nHọ mang theo những buổi chiều ta từng chờ đợi,\nnhững câu chuyện chẳng bao giờ kể hết,\nvà một phiên bản rất dịu dàng của chính ta.", "author": "Tự biên", "note": "trích dẫn tự biên", "mood": "thu-hoai-niem", "folders": ["15_Mua-thu", "19_Suong-mu"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Có những người rời đi nhưng ký ức thì ở lại", "tts": "[softly] Có những người rời đi nhưng ký ức thì ở lại. [long pause]\nNgười rời đi thường mang theo cả một phần thanh xuân của người ở lại. [pause]\nHọ mang theo những buổi chiều ta từng chờ đợi, [pause]\nnhững câu chuyện chẳng bao giờ kể hết, [pause]\nvà một phiên bản rất dịu dàng của chính ta.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q064", "kind": "Trích dẫn", "title": "Đúng người", "text": "Đúng người thì im lặng cũng thấy bình yên.\nSai người thì nói gì cũng thành tổn thương.\nTình yêu không làm ta phải đoán mãi,\nkhông bắt ta xin một chút dịu dàng.", "author": "Tự biên", "note": "trích dẫn tự biên", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 22, "hook": "Bình yên trong tình yêu đôi khi rất dễ nhận ra", "tts": "[softly] Bình yên trong tình yêu đôi khi rất dễ nhận ra. [long pause]\nĐúng người thì im lặng cũng thấy bình yên. [pause]\nSai người thì nói gì cũng thành tổn thương. [pause]\nTình yêu không làm ta phải đoán mãi, [pause]\nkhông bắt ta xin một chút dịu dàng.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q065", "kind": "Trích dẫn", "title": "Một ngày chỉ muốn yên", "text": "Có những ngày chẳng muốn đi đâu, chỉ muốn ngồi yên để lòng mình tự nguôi.\nKhông cần phải mạnh mẽ trước tất cả mọi người.\nMột tách trà, một ô cửa, một buổi chiều chậm,\nđôi khi cũng đủ cứu mình khỏi một ngày dài.", "author": "Tự biên", "note": "chữa lành, nghỉ ngơi", "mood": "binh-yen", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 26, "hook": "Nếu hôm nay bạn mệt, hãy cho mình một ngày được nghỉ", "tts": "[softly] Nếu hôm nay bạn mệt, hãy cho mình một ngày được nghỉ. [long pause]\nCó những ngày chẳng muốn đi đâu, [short pause] chỉ muốn ngồi yên để lòng mình tự nguôi. [pause]\nKhông cần phải mạnh mẽ trước tất cả mọi người. [pause]\nMột tách trà, [short pause] một ô cửa, [short pause] một buổi chiều chậm, [pause]\nđôi khi cũng đủ cứu mình khỏi một ngày dài.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q066", "kind": "Trích dẫn", "title": "Còn yêu chưa đủ", "text": "Mình từng nghĩ chỉ cần còn yêu là đủ.\nSau này mới hiểu, còn yêu không có nghĩa là còn thuộc về nhau.\nCó những người ta thương bằng tất cả dịu dàng,\nnhưng chỉ có thể tiễn nhau về hai phía.", "author": "Tự biên", "note": "chia tay, trưởng thành", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Có những điều tình yêu cũng không thể giữ lại", "tts": "[softly] Có những điều tình yêu cũng không thể giữ lại. [long pause]\nMình từng nghĩ chỉ cần còn yêu là đủ. [pause]\nSau này mới hiểu, [short pause] còn yêu không có nghĩa là còn thuộc về nhau. [pause]\nCó những người ta thương bằng tất cả dịu dàng, [pause]\nnhưng chỉ có thể tiễn nhau về hai phía.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q067", "kind": "Trích dẫn", "title": "Bình yên", "text": "Bình yên không phải là không có chuyện gì xảy ra.\nBình yên là sau tất cả, lòng mình vẫn nhẹ nhàng.\nLà không còn muốn thắng trong mọi cuộc tranh luận,\nvà biết thương mình trước khi chờ người khác thương.", "author": "Tự biên", "note": "chữa lành", "mood": "binh-yen", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Sau cùng, điều ai cũng cần là một lòng mình thật nhẹ", "tts": "[softly] Sau cùng, điều ai cũng cần là một lòng mình thật nhẹ. [long pause]\nBình yên không phải là không có chuyện gì xảy ra. [pause]\nBình yên là sau tất cả, [short pause] lòng mình vẫn nhẹ nhàng. [pause]\nLà không còn muốn thắng trong mọi cuộc tranh luận, [pause]\nvà biết thương mình trước khi chờ người khác thương.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q068", "kind": "Trích dẫn", "title": "Một đoạn đường đẹp", "text": "Nếu đã không thể cùng nhau đi đến cuối con đường,\nmong chúng ta từng là một đoạn đường đẹp của nhau.\nĐừng biến những ngày vui thành lý do để oán trách,\ncó người đi qua đời ta chỉ để dạy ta biết yêu.", "author": "Tự biên", "note": "chia tay văn minh", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 26, "hook": "Không phải chuyện tình nào cũng cần một cái kết ở bên nhau", "tts": "[softly] Không phải chuyện tình nào cũng cần một cái kết ở bên nhau. [long pause]\nNếu đã không thể cùng nhau đi đến cuối con đường, [pause]\nmong chúng ta từng là một đoạn đường đẹp của nhau. [pause]\nĐừng biến những ngày vui thành lý do để oán trách, [pause]\ncó người đi qua đời ta chỉ để dạy ta biết yêu.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q069", "kind": "Trích dẫn", "title": "Đà Lạt lạnh", "text": "Đà Lạt lạnh vì sương, lòng người lạnh vì điều chưa nói.\nCó những buổi chiều mây trôi rất thấp,\nta ngồi bên cửa kính nhìn thành phố lên đèn,\nvà nhớ một người chẳng biết mình đang nhớ.", "author": "Tự biên", "note": "Đà Lạt, điều chưa nói", "mood": "thu-hoai-niem", "folders": ["15_Mua-thu", "19_Suong-mu"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 24, "hook": "Đà Lạt có một kiểu lạnh rất giống nỗi nhớ", "tts": "[softly] Đà Lạt có một kiểu lạnh rất giống nỗi nhớ. [long pause]\nĐà Lạt lạnh vì sương, [short pause] lòng người lạnh vì điều chưa nói. [pause]\nCó những buổi chiều mây trôi rất thấp, [pause]\nta ngồi bên cửa kính nhìn thành phố lên đèn, [pause]\nvà nhớ một người chẳng biết mình đang nhớ.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q070", "kind": "Trích dẫn", "title": "Cơn mưa", "text": "Có người đến như một cơn mưa, làm dịu cả mùa hè.\nCó người đi như cơn mưa, để lại một khoảng trời buốt lạnh.\nSau cùng, ta học cách yêu những ngày nắng,\nvà không trách mùa mưa vì đã từng ghé qua.", "author": "Tự biên", "note": "tình yêu, mưa", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "", "vnote": "Không gán tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 26, "hook": "Có người đến để chữa lành, cũng có người đến để lại một mùa mưa", "tts": "[softly] Có người đến để chữa lành, cũng có người đến để lại một mùa mưa. [long pause]\nCó người đến như một cơn mưa, [short pause] làm dịu cả mùa hè. [pause]\nCó người đi như cơn mưa, [short pause] để lại một khoảng trời buốt lạnh. [pause]\nSau cùng, [short pause] ta học cách yêu những ngày nắng, [pause]\nvà không trách mùa mưa vì đã từng ghé qua.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q075", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 28/10 — Bắt đầu từ điều nhỏ", "text": "Đi qua những ngày chật vật, ta mới quý một buổi sáng lòng mình bớt nặng.\nCó bữa cơm để ăn, có công việc để làm, có người còn đợi mình về.\nNhững điều từng thấy quá bình thường, đến một lúc lại thành mong ước.\nNếu hôm qua chưa được như ý, sáng nay cứ bắt đầu từ một việc nhỏ.\nĂn một bữa đàng hoàng, làm việc vừa sức, nói với nhau một câu dễ nghe.\nĐời còn nhiều lo toan, mong bạn vẫn tìm được một điều để mỉm cười.", "author": "Tự biên", "note": "ngày 28/10 · khởi đầu · hành động nhỏ", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; đọc chậm rãi, suy tư, ấm áp ở phần kết.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 28/10", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày hai mươi tám tháng mười. [pause]\n[reflective] Đi qua những ngày chật vật, [short pause] ta mới quý một buổi sáng lòng mình bớt nặng. [pause]\nCó bữa cơm để ăn, có công việc để làm, [short pause] có người còn đợi mình về. [long pause]\nNhững điều từng thấy quá bình thường, [short pause] đến một lúc lại thành mong ước. [pause]\n[warmly] Nếu hôm qua chưa được như ý, [short pause] sáng nay cứ bắt đầu từ một việc nhỏ. [pause]\nĂn một bữa đàng hoàng, làm việc vừa sức, [short pause] nói với nhau một câu dễ nghe. [pause]\n[softly] Đời còn nhiều lo toan, [short pause] mong bạn vẫn tìm được một điều để mỉm cười.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q076", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 29/10 — Những đổi thay thầm lặng", "text": "Có những đổi thay chỉ mình ta biết, chẳng ai đứng bên để vỗ tay.\nNgày trước một lời chê đủ làm mất ngủ, giờ ta biết nghe rồi chọn điều cần sửa.\nNgày trước cứ nhận lỗi về mình, giờ đã biết điều gì nằm ngoài sức.\nSống thêm một đoạn, ta học được cách bớt khắt khe với bản thân.\nĐừng vì chưa có thành tựu lớn mà quên những lần mình đã đứng dậy.\nBạn của sáng nay đã đi qua nhiều chuyện, xứng đáng được đối xử dịu dàng.", "author": "Tự biên", "note": "ngày 29/10 · trưởng thành · ghi nhận bản thân", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; suy tư về sự trưởng thành; ghi nhận bản thân, kết dịu dàng.", "audio": [], "est": 44, "hook": "Chào ngày mới, Hôm nay là ngày 29/10", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày hai mươi chín tháng mười. [pause]\n[reflective] Có những đổi thay chỉ mình ta biết, [short pause] chẳng ai đứng bên để vỗ tay. [pause]\nNgày trước một lời chê đủ làm mất ngủ, [short pause] giờ ta biết nghe rồi chọn điều cần sửa. [pause]\nNgày trước cứ nhận lỗi về mình, giờ đã biết điều gì nằm ngoài sức. [long pause]\n[warmly] Sống thêm một đoạn, [short pause] ta học được cách bớt khắt khe với bản thân. [pause]\nĐừng vì chưa có thành tựu lớn mà quên những lần mình đã đứng dậy. [pause]\n[softly] Bạn của sáng nay đã đi qua nhiều chuyện, [short pause] xứng đáng được đối xử dịu dàng.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q077", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 30/10 — Giữ lại một chút dịu dàng", "text": "Có hôm ta mang một chuyện buồn đi suốt ngày, rồi vô tình làm đau người chẳng có lỗi.\nĐến khi bình tâm, điều tiếc nhất lại là câu nói với người thương mình.\nCuộc sống đã đủ nhiều va chạm, về bên nhau hãy nhẹ lời một chút.\nNếu đang mệt, bạn có thể nói rằng mình cần được yên một lát.\nNgười gần gũi cũng cần được nâng niu như những điều ta sợ mất.\nSáng nay, mong bạn giữ được chút dịu dàng cho mình và cho người bên cạnh.", "author": "Tự biên", "note": "ngày 30/10 · dịu dàng · người thân", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; trầm lắng ở đoạn tiếc nuối; ấm áp, nhẹ lời ở phần sau.", "audio": [], "est": 44, "hook": "Chào ngày mới, Hôm nay là ngày 30/10", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày ba mươi tháng mười. [pause]\n[reflective] Có hôm ta mang một chuyện buồn đi suốt ngày, [short pause] rồi vô tình làm đau người chẳng có lỗi. [pause]\nĐến khi bình tâm, [short pause] điều tiếc nhất lại là câu nói với người thương mình. [long pause]\n[warmly] Cuộc sống đã đủ nhiều va chạm, [short pause] về bên nhau hãy nhẹ lời một chút. [pause]\nNếu đang mệt, [short pause] bạn có thể nói rằng mình cần được yên một lát. [pause]\nNgười gần gũi cũng cần được nâng niu như những điều ta sợ mất. [pause]\n[softly] Sáng nay, [short pause] mong bạn giữ được chút dịu dàng cho mình và cho người bên cạnh.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q078", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 31/10 — Can đảm bước qua nỗi sợ", "text": "Từng thất vọng, ta dễ chần chừ trước một cơ hội giống điều đã làm mình đau.\nSợ tin nhầm người, sợ cố gắng rồi lại trở về tay trắng.\nNhững dè dặt ấy có lý do, bạn chẳng cần trách mình yếu lòng.\nCứ tìm hiểu kỹ hơn, bước chậm hơn, cho bản thân một đường lui an toàn.\nChuyện cũ có thể nhắc ta cẩn trọng, nhưng vẫn còn điều mới đáng để thử.\nMong sáng nay bạn đủ an tâm để bước một bước nhỏ về phía mình muốn.", "author": "Tự biên", "note": "ngày 31/10 · can đảm · vượt qua nỗi sợ", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; thấu hiểu nỗi sợ; trấn an, khích lệ vừa phải ở phần kết.", "audio": [], "est": 44, "hook": "Chào ngày mới, Hôm nay là ngày 31/10", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày ba mươi mốt tháng mười. [pause]\n[reflective] Từng thất vọng, [short pause] ta dễ chần chừ trước một cơ hội giống điều đã làm mình đau. [pause]\nSợ tin nhầm người, [short pause] sợ cố gắng rồi lại trở về tay trắng. [long pause]\n[reassuring] Những dè dặt ấy có lý do, [short pause] bạn chẳng cần trách mình yếu lòng. [pause]\nCứ tìm hiểu kỹ hơn, bước chậm hơn, cho bản thân một đường lui an toàn. [pause]\nChuyện cũ có thể nhắc ta cẩn trọng, [short pause] nhưng vẫn còn điều mới đáng để thử. [pause]\n[softly] Mong sáng nay bạn đủ an tâm để bước một bước nhỏ về phía mình muốn.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q079", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 01/11 — Mở trang tháng mới", "text": "Tháng vừa rồi, có lẽ bạn đã có những ngày chỉ mong mình đủ sức đi qua.\nCó việc còn dang dở, có lời hẹn chưa thành, có nỗi buồn chưa biết kể cùng ai.\nBước sang tháng mới, chẳng cần ép lòng phải vui ngay.\nCứ thu xếp từng việc, chăm lại giấc ngủ, dành thời gian cho người mình quý.\nNhững gì đã qua, mong bạn giữ được bài học mà bớt mang theo lời tự trách.\nTháng này, chúc bạn có thêm những tối ngủ yên và những sáng thấy lòng nhẹ nhõm.", "author": "Tự biên", "note": "01/11 · đầu tháng mới · khởi đầu", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; chào tháng mới ấm áp; lắng lại với chuyện cũ, kết nhẹ nhõm.", "audio": [], "est": 49, "hook": "Chào tháng mới, Hôm nay là ngày 01/11. Chúc bạn một tháng bình an và nhiều khởi sắc", "tts": "[calm] [low-pitched] [deliberate] Chào tháng mới. [short pause] Hôm nay là ngày mùng một tháng mười một. [short pause] Chúc bạn một tháng bình an và nhiều khởi sắc. [pause]\n[reflective] Tháng vừa rồi, [short pause] có lẽ bạn đã có những ngày chỉ mong mình đủ sức đi qua. [pause]\nCó việc còn dang dở, có lời hẹn chưa thành, [short pause] có nỗi buồn chưa biết kể cùng ai. [long pause]\n[warmly] Bước sang tháng mới, [short pause] chẳng cần ép lòng phải vui ngay. [pause]\nCứ thu xếp từng việc, chăm lại giấc ngủ, dành thời gian cho người mình quý. [pause]\nNhững gì đã qua, [short pause] mong bạn giữ được bài học mà bớt mang theo lời tự trách. [pause]\n[softly] Tháng này, [short pause] chúc bạn có thêm những tối ngủ yên và những sáng thấy lòng nhẹ nhõm.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q080", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 02/11 — Nuôi dưỡng bình yên", "text": "Có một thời ta muốn giải thích mọi hiểu lầm, giữ bằng được mọi mối quan hệ.\nSau nhiều đêm trằn trọc, mới nhận ra lòng mình cũng cần được nghỉ.\nCó người nghe một câu đã hiểu, có người nói mãi vẫn chẳng chịu nghe.\nBạn được phép dừng cuộc trò chuyện khiến mình tổn thương và giữ một khoảng cách cần thiết.\nThời gian còn lại, dành cho bữa cơm ngon và những người khiến bạn thấy dễ chịu.\nBình yên đôi khi bắt đầu từ việc thôi cố có mặt trong lòng tất cả.", "author": "Tự biên", "note": "ngày 02/11 · bình yên · chăm sóc bản thân", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; trầm tĩnh, từng trải; nói về giới hạn một cách bình thản.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 02/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng hai tháng mười một. [pause]\n[reflective] Có một thời ta muốn giải thích mọi hiểu lầm, [short pause] giữ bằng được mọi mối quan hệ. [pause]\nSau nhiều đêm trằn trọc, [short pause] mới nhận ra lòng mình cũng cần được nghỉ. [pause]\nCó người nghe một câu đã hiểu, [short pause] có người nói mãi vẫn chẳng chịu nghe. [long pause]\n[calm] Bạn được phép dừng cuộc trò chuyện khiến mình tổn thương và giữ một khoảng cách cần thiết. [pause]\nThời gian còn lại, [short pause] dành cho bữa cơm ngon và những người khiến bạn thấy dễ chịu. [pause]\n[softly] Bình yên đôi khi bắt đầu từ việc thôi cố có mặt trong lòng tất cả.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q081", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 03/11 — Giữ lời với chính mình", "text": "Ta thường nhớ lời đã hứa với người khác, còn lời hứa với mình cứ hẹn lần sau.\nHẹn ngủ sớm, hẹn bớt ôm việc, hẹn dành thời gian cho điều mình thích.\nRồi ngày tháng trôi qua, người bị bỏ quên lại là chính mình.\nHôm nay, thử giữ một lời hứa nhỏ, vừa với sức và hoàn cảnh đang có.\nMột buổi đi bộ, vài trang sách, hay tắt điện thoại để ăn cho trọn bữa.\nChăm chút đều đặn như thế, bạn sẽ thấy đời mình có phần do mình quyết định.", "author": "Tự biên", "note": "ngày 03/11 · giữ lời với mình · chăm sóc bản thân", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; tâm tình về điều từng bỏ quên; khuyến khích nhẹ nhàng.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 03/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng ba tháng mười một. [pause]\n[reflective] Ta thường nhớ lời đã hứa với người khác, [short pause] còn lời hứa với mình cứ hẹn lần sau. [pause]\nHẹn ngủ sớm, hẹn bớt ôm việc, [short pause] hẹn dành thời gian cho điều mình thích. [pause]\nRồi ngày tháng trôi qua, [short pause] người bị bỏ quên lại là chính mình. [long pause]\n[warmly] Hôm nay, [short pause] thử giữ một lời hứa nhỏ, vừa với sức và hoàn cảnh đang có. [pause]\nMột buổi đi bộ, vài trang sách, hay tắt điện thoại để ăn cho trọn bữa. [pause]\n[softly] Chăm chút đều đặn như thế, [short pause] bạn sẽ thấy đời mình có phần do mình quyết định.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q082", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 04/11 — Đừng so sánh hành trình", "text": "Nhìn người cùng tuổi đi xa, đôi khi ta chạnh lòng vì mình vẫn còn loay hoay.\nNhưng có những năm bạn đã dành để chăm người ốm, giữ gia đình, hoặc tự chữa lành.\nNhững đoạn đường ấy ít ai nhìn thấy, chỉ bạn biết mình đã vất vả thế nào.\nĐừng lấy phần rực rỡ của người khác để phủ nhận cả hành trình mình.\nCứ làm điều phù hợp với sức lực và trách nhiệm đang mang.\nMột cuộc sống vừa vặn với bạn cũng là điều đáng để kiên nhẫn xây dựng.", "author": "Tự biên", "note": "ngày 04/11 · không so sánh · tin vào hành trình", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; thấu cảm, không thúc giục; kết vững vàng và nâng đỡ.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 04/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng bốn tháng mười một. [pause]\n[reflective] Nhìn người cùng tuổi đi xa, [short pause] đôi khi ta chạnh lòng vì mình vẫn còn loay hoay. [pause]\nNhưng có những năm bạn đã dành để chăm người ốm, giữ gia đình, [short pause] hoặc tự chữa lành. [pause]\nNhững đoạn đường ấy ít ai nhìn thấy, [short pause] chỉ bạn biết mình đã vất vả thế nào. [long pause]\n[reassuring] Đừng lấy phần rực rỡ của người khác để phủ nhận cả hành trình mình. [pause]\nCứ làm điều phù hợp với sức lực và trách nhiệm đang mang. [pause]\n[softly] Một cuộc sống vừa vặn với bạn cũng là điều đáng để kiên nhẫn xây dựng.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q083", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 05/11 — Biết ơn điều đang có", "text": "Lúc còn đủ đầy, ta dễ nghĩ một cuộc gọi hỏi thăm ngày nào cũng sẽ có.\nĐến khi có những số điện thoại không còn ai trả lời, mới hiểu sự bình thường quý giá thế nào.\nMột người nhớ giờ ăn, một mái nhà còn tiếng nói, một cuộc hẹn vẫn kịp trở về.\nNhững điều ấy đáng được để tâm ngay khi còn trong tay.\nSáng nay, nếu nhớ ai, hãy nhắn cho họ một lời.\nThương nhau khi còn có thể, để sau này bớt một lần ước giá như.", "author": "Tự biên", "note": "ngày 05/11 · biết ơn · đủ đầy", "mood": "biet-on", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; lắng sâu khi nhắc mất mát; ấm áp, trân trọng ở phần kết.", "audio": [], "est": 44, "hook": "Chào ngày mới, Hôm nay là ngày 05/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng năm tháng mười một. [pause]\n[reflective] Lúc còn đủ đầy, [short pause] ta dễ nghĩ một cuộc gọi hỏi thăm ngày nào cũng sẽ có. [pause]\nĐến khi có những số điện thoại không còn ai trả lời, [short pause] mới hiểu sự bình thường quý giá thế nào. [long pause]\nMột người nhớ giờ ăn, một mái nhà còn tiếng nói, [short pause] một cuộc hẹn vẫn kịp trở về. [pause]\n[warmly] Những điều ấy đáng được để tâm ngay khi còn trong tay. [pause]\nSáng nay, nếu nhớ ai, [short pause] hãy nhắn cho họ một lời. [pause]\n[softly] Thương nhau khi còn có thể, [short pause] để sau này bớt một lần ước giá như.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q084", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 06/11 — Đi qua một ngày khó", "text": "Có những ngày đã làm hết sức mà mọi chuyện vẫn chẳng theo ý mình.\nBuồn là điều dễ hiểu, bạn không cần vội tìm một ý nghĩa đẹp cho từng mất mát.\nTrước mắt, cứ lo bữa ăn, giấc ngủ, rồi xem việc nào còn có thể thu xếp.\nĐiều vượt quá sức, hãy thử nhờ một người đáng tin cùng nghĩ.\nMột ngày khó chỉ nói rằng bạn đang gặp khó, đâu đủ để kết luận cả cuộc đời.\nSáng nay còn đây, mong bạn có thêm chút sức để bước tiếp từng việc một.", "author": "Tự biên", "note": "ngày 06/11 · ngày khó khăn · đón nhận giúp đỡ", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; điềm đạm, thấu hiểu; trấn an người đang trải qua ngày khó.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 06/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng sáu tháng mười một. [pause]\n[reflective] Có những ngày đã làm hết sức mà mọi chuyện vẫn chẳng theo ý mình. [pause]\nBuồn là điều dễ hiểu, [short pause] bạn không cần vội tìm một ý nghĩa đẹp cho từng mất mát. [long pause]\n[reassuring] Trước mắt, cứ lo bữa ăn, giấc ngủ, [short pause] rồi xem việc nào còn có thể thu xếp. [pause]\nĐiều vượt quá sức, [short pause] hãy thử nhờ một người đáng tin cùng nghĩ. [pause]\nMột ngày khó chỉ nói rằng bạn đang gặp khó, [short pause] đâu đủ để kết luận cả cuộc đời. [pause]\n[softly] Sáng nay còn đây, [short pause] mong bạn có thêm chút sức để bước tiếp từng việc một.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q085", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 07/11 — Nghỉ ngơi không phải bỏ cuộc", "text": "Có thời ta tưởng cứ làm thêm một chút là cuộc sống sẽ bớt lo.\nRồi công việc nối công việc, đến bữa cơm cũng ăn trong vội vã.\nChỉ khi người mệt rã rời mới thấy giấc ngủ yên đã xa mình quá lâu.\nNếu hôm nay đuối sức, hãy bớt một việc chưa cần gấp và cho mình nghỉ.\nBạn còn một chặng đường dài, còn người muốn ngồi cùng bạn thật lâu bên mâm cơm.\nGiữ sức cho mình cũng là giữ lại những ngày được sống trọn vẹn bên họ.", "author": "Tự biên", "note": "ngày 07/11 · nghỉ ngơi · bền bỉ", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; tâm sự chậm rãi về sự mỏi mệt; kết ấm, cho phép nghỉ ngơi.", "audio": [], "est": 44, "hook": "Chào ngày mới, Hôm nay là ngày 07/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng bảy tháng mười một. [pause]\n[reflective] Có thời ta tưởng cứ làm thêm một chút là cuộc sống sẽ bớt lo. [pause]\nRồi công việc nối công việc, [short pause] đến bữa cơm cũng ăn trong vội vã. [pause]\nChỉ khi người mệt rã rời mới thấy giấc ngủ yên đã xa mình quá lâu. [long pause]\n[warmly] Nếu hôm nay đuối sức, [short pause] hãy bớt một việc chưa cần gấp và cho mình nghỉ. [pause]\nBạn còn một chặng đường dài, [short pause] còn người muốn ngồi cùng bạn thật lâu bên mâm cơm. [pause]\n[softly] Giữ sức cho mình cũng là giữ lại những ngày được sống trọn vẹn bên họ.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q086", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 08/11 — Tử tế tạo nên ngày đẹp", "text": "Đi qua một quãng chật vật, ta thường nhớ người đã đối xử nhẹ nhàng với mình.\nCó khi chỉ là cô bán hàng cho nợ, người đồng nghiệp lặng lẽ làm giúp một việc.\nHọ có thể đã quên, còn ta mang theo hơi ấm ấy rất lâu.\nBởi vậy, gặp ai đang lúng túng, nếu có thể hãy cho họ thêm chút kiên nhẫn.\nMột câu nói dễ nghe cũng đủ giúp người khác bớt thấy mình đơn độc.\nMong ngày mới của bạn có những cuộc gặp khiến lòng người được ấm lên như thế.", "author": "Tự biên", "note": "ngày 08/11 · tử tế · sẻ chia", "mood": "biet-on", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; ấm áp khi kể chuyện được giúp; suy tư, chân thành ở phần sau.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 08/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng tám tháng mười một. [pause]\n[warmly] Đi qua một quãng chật vật, [short pause] ta thường nhớ người đã đối xử nhẹ nhàng với mình. [pause]\nCó khi chỉ là cô bán hàng cho nợ, [short pause] người đồng nghiệp lặng lẽ làm giúp một việc. [pause]\nHọ có thể đã quên, [short pause] còn ta mang theo hơi ấm ấy rất lâu. [long pause]\n[reflective] Bởi vậy, gặp ai đang lúng túng, nếu có thể [short pause] hãy cho họ thêm chút kiên nhẫn. [pause]\nMột câu nói dễ nghe cũng đủ giúp người khác bớt thấy mình đơn độc. [pause]\n[softly] Mong ngày mới của bạn có những cuộc gặp khiến lòng người được ấm lên như thế.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q087", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 09/11 — Sống có nguyên tắc", "text": "Đã từng vì cả nể mà nhận một việc trái lòng, ta mới hiểu cái giá của chữ đồng ý.\nCó lợi trước mắt nhưng tối về lại khó ngủ, có lời khen nghe xong chẳng thấy vui.\nSống lâu hơn một chút, ta cần biết điều gì mình có thể đánh đổi.\nGiữ lời đã hứa, nhận lỗi khi sai, từ chối điều khiến mình day dứt.\nNhững lựa chọn ấy đôi khi làm đường đi khó hơn, nhưng giúp lòng bớt nặng.\nMong bạn kiếm được bình yên từ chính cách mình sống hôm nay.", "author": "Tự biên", "note": "ngày 09/11 · trách nhiệm · sống ngay thẳng", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; trầm, vững vàng; nhấn vừa đủ vào trách nhiệm và sự ngay thẳng.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 09/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mùng chín tháng mười một. [pause]\n[reflective] Đã từng vì cả nể mà nhận một việc trái lòng, [short pause] ta mới hiểu cái giá của chữ đồng ý. [pause]\nCó lợi trước mắt nhưng tối về lại khó ngủ, [short pause] có lời khen nghe xong chẳng thấy vui. [long pause]\n[calm] Sống lâu hơn một chút, [short pause] ta cần biết điều gì mình có thể đánh đổi. [pause]\nGiữ lời đã hứa, nhận lỗi khi sai, [short pause] từ chối điều khiến mình day dứt. [pause]\nNhững lựa chọn ấy đôi khi làm đường đi khó hơn, [short pause] nhưng giúp lòng bớt nặng. [pause]\n[softly] Mong bạn kiếm được bình yên từ chính cách mình sống hôm nay.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q088", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 10/11 — Một buổi sáng dành cho mình", "text": "Có những sáng vừa mở mắt, ta đã nghĩ đến tiền nhà, công việc và bao điều chưa xong.\nChưa kịp uống ngụm nước đã thấy một ngày thật dài.\nNếu có thể, hãy dành vài phút ngồi yên trước khi bước vào những bận rộn ấy.\nNhìn ánh sáng ngoài cửa, ăn miếng bánh, hỏi mình hôm nay cần làm điều gì trước.\nNhững lo toan vẫn ở đó, nhưng bạn cũng cần một chỗ cho mình trong ngày.\nMong buổi sáng này đủ chậm để bạn nghe được lòng mình và bắt đầu thong thả hơn.", "author": "Tự biên", "note": "ngày 10/11 · khoảng lặng buổi sáng · lo toan", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; mở đầu tâm tình; thả nhịp chậm, thư thái ở phần sau.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 10/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười tháng mười một. [pause]\n[reflective] Có những sáng vừa mở mắt, [short pause] ta đã nghĩ đến tiền nhà, công việc và bao điều chưa xong. [pause]\nChưa kịp uống ngụm nước đã thấy một ngày thật dài. [long pause]\n[calm] Nếu có thể, [short pause] hãy dành vài phút ngồi yên trước khi bước vào những bận rộn ấy. [pause]\nNhìn ánh sáng ngoài cửa, ăn miếng bánh, [short pause] hỏi mình hôm nay cần làm điều gì trước. [pause]\nNhững lo toan vẫn ở đó, [short pause] nhưng bạn cũng cần một chỗ cho mình trong ngày. [pause]\n[softly] Mong buổi sáng này đủ chậm để bạn nghe được lòng mình và bắt đầu thong thả hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q089", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 11/11 — Dám tin vào mình", "text": "Sau một lần làm không được, điều đau nhất đôi khi là mình thôi tin vào mình.\nTa nhớ mãi lỗi sai, rồi quên những việc từng làm tốt và những người từng được mình giúp.\nMột kết quả chưa như ý chỉ cho thấy có điều cần học thêm hoặc làm khác.\nBạn có thể thử lại, đổi cách, hay chọn một hướng phù hợp hơn.\nĐừng để tiếng nói nghi ngờ trở thành lời duy nhất mình nghe mỗi sáng.\nTrong bạn vẫn còn khả năng chưa dùng hết, hãy cho nó thêm một cơ hội.", "author": "Tự biên", "note": "ngày 11/11 · tin vào bản thân · kiên trì", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; suy tư về thất bại; nâng đỡ, khích lệ bằng giọng điềm tĩnh.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 11/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười một tháng mười một. [pause]\n[reflective] Sau một lần làm không được, [short pause] điều đau nhất đôi khi là mình thôi tin vào mình. [pause]\nTa nhớ mãi lỗi sai, [short pause] rồi quên những việc từng làm tốt và những người từng được mình giúp. [long pause]\nMột kết quả chưa như ý chỉ cho thấy có điều cần học thêm hoặc làm khác. [pause]\n[reassuring] Bạn có thể thử lại, đổi cách, [short pause] hay chọn một hướng phù hợp hơn. [pause]\nĐừng để tiếng nói nghi ngờ trở thành lời duy nhất mình nghe mỗi sáng. [pause]\n[softly] Trong bạn vẫn còn khả năng chưa dùng hết, [short pause] hãy cho nó thêm một cơ hội.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q090", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 12/11 — Buông điều không thể đổi", "text": "Có lời giải thích ta đã đợi rất lâu, cuối cùng vẫn chẳng nhận được.\nCó người rời đi để lại những câu hỏi mà một mình ta cứ trả lời rồi lại nghi ngờ.\nBạn không cần hiểu hết mọi chuyện mới được phép sống tiếp ngày của mình.\nCứ cất bớt một kỷ vật, thôi đọc lại một tin nhắn, trở về với việc đang làm.\nNỗi nhớ có thể còn, nhưng cuộc sống cũng cần được chăm nom.\nSáng nay, mong bạn dành cho hiện tại một chút tình thương từng để hết trong chuyện cũ.", "author": "Tự biên", "note": "ngày 12/11 · buông bỏ · hướng về phía trước", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; lắng sâu với chuyện cũ; trấn an, hướng về hiện tại thật nhẹ.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 12/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười hai tháng mười một. [pause]\n[reflective] Có lời giải thích ta đã đợi rất lâu, [short pause] cuối cùng vẫn chẳng nhận được. [pause]\nCó người rời đi để lại những câu hỏi mà một mình ta cứ trả lời rồi lại nghi ngờ. [long pause]\n[reassuring] Bạn không cần hiểu hết mọi chuyện mới được phép sống tiếp ngày của mình. [pause]\nCứ cất bớt một kỷ vật, thôi đọc lại một tin nhắn, [short pause] trở về với việc đang làm. [pause]\nNỗi nhớ có thể còn, [short pause] nhưng cuộc sống cũng cần được chăm nom. [pause]\n[softly] Sáng nay, [short pause] mong bạn dành cho hiện tại một chút tình thương từng để hết trong chuyện cũ.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q091", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 13/11 — Gánh vừa sức mình", "text": "Người quen gánh vác thường nói mình ổn, ngay cả khi đã mệt đến chẳng muốn nói gì.\nSợ người nhà lo, sợ đồng nghiệp thất vọng, rồi việc nào cũng cố ôm vào.\nNhưng sức người có hạn, có việc cần được chia ra mới đi được đường dài.\nHôm nay, bạn có thể nói thật rằng mình cần giúp đỡ hoặc cần thêm thời gian.\nNgười thương bạn cũng cần được biết lúc nào nên đưa một bàn tay.\nMong bạn làm xong việc cần làm, và vẫn còn đủ sức để vui khi trở về.", "author": "Tự biên", "note": "ngày 13/11 · gánh vác · chia sẻ trách nhiệm", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; thấu cảm người gánh vác; ấm áp khi nói về sự giúp đỡ.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 13/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười ba tháng mười một. [pause]\n[reflective] Người quen gánh vác thường nói mình ổn, [short pause] ngay cả khi đã mệt đến chẳng muốn nói gì. [pause]\nSợ người nhà lo, sợ đồng nghiệp thất vọng, [short pause] rồi việc nào cũng cố ôm vào. [long pause]\n[reassuring] Nhưng sức người có hạn, [short pause] có việc cần được chia ra mới đi được đường dài. [pause]\nHôm nay, [short pause] bạn có thể nói thật rằng mình cần giúp đỡ hoặc cần thêm thời gian. [pause]\nNgười thương bạn cũng cần được biết lúc nào nên đưa một bàn tay. [pause]\n[softly] Mong bạn làm xong việc cần làm, [short pause] và vẫn còn đủ sức để vui khi trở về.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q092", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 14/11 — Yêu thương chính mình", "text": "Ta có thể tha thứ cho người khác rất nhanh, nhưng một lỗi của mình lại nhắc mãi.\nĐêm xuống, những câu giá như cứ quay về, khiến việc đã qua vẫn làm lòng nhức nhối.\nNếu có điều cần sửa, hãy nhận trách nhiệm và sửa trong phần mình còn làm được.\nRồi cho bản thân cơ hội sống khác đi từ hôm nay.\nCon người lúc ấy đã lựa chọn bằng những gì lúc ấy hiểu và có.\nMong bạn đủ nghiêm túc để trưởng thành, cũng đủ dịu dàng để thôi làm đau mình.", "author": "Tự biên", "note": "ngày 14/11 · yêu bản thân · dịu dàng", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; chậm, bao dung; giữ sự nghiêm túc mà không trách móc.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 14/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười bốn tháng mười một. [pause]\n[reflective] Ta có thể tha thứ cho người khác rất nhanh, [short pause] nhưng một lỗi của mình lại nhắc mãi. [pause]\nĐêm xuống, những câu giá như cứ quay về, [short pause] khiến việc đã qua vẫn làm lòng nhức nhối. [long pause]\nNếu có điều cần sửa, [short pause] hãy nhận trách nhiệm và sửa trong phần mình còn làm được. [pause]\n[warmly] Rồi cho bản thân cơ hội sống khác đi từ hôm nay. [pause]\nCon người lúc ấy đã lựa chọn bằng những gì lúc ấy hiểu và có. [pause]\n[softly] Mong bạn đủ nghiêm túc để trưởng thành, [short pause] cũng đủ dịu dàng để thôi làm đau mình.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q093", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 15/11 — Đừng vội với đời mình", "text": "Càng lớn, ta càng hiểu có những việc sốt ruột mấy cũng chẳng thể nhanh hơn.\nMột món nợ cần thời gian trả, một nghề cần thời gian giỏi, một vết buồn cần thời gian nguôi.\nNgày nào cũng đếm xem mình còn thiếu bao nhiêu, lòng sẽ khó có lúc được yên.\nThỉnh thoảng hãy nhìn lại phần đường đã đi và điều đã bớt làm mình sợ.\nBạn vẫn có thể điều chỉnh kế hoạch mà không xem mình là kẻ thất bại.\nCứ đi từng đoạn vừa sức, cho đời mình thêm thời gian để đổi thay.", "author": "Tự biên", "note": "ngày 15/11 · kiên nhẫn · sống vừa sức", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; điềm đạm như lời người đi trước; trấn an, không vội vàng.", "audio": [], "est": 47, "hook": "Chào ngày mới, Hôm nay là ngày 15/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười lăm tháng mười một. [pause]\n[reflective] Càng lớn, [short pause] ta càng hiểu có những việc sốt ruột mấy cũng chẳng thể nhanh hơn. [pause]\nMột món nợ cần thời gian trả, một nghề cần thời gian giỏi, [short pause] một vết buồn cần thời gian nguôi. [pause]\nNgày nào cũng đếm xem mình còn thiếu bao nhiêu, [short pause] lòng sẽ khó có lúc được yên. [long pause]\n[reassuring] Thỉnh thoảng hãy nhìn lại phần đường đã đi và điều đã bớt làm mình sợ. [pause]\nBạn vẫn có thể điều chỉnh kế hoạch mà không xem mình là kẻ thất bại. [pause]\n[softly] Cứ đi từng đoạn vừa sức, [short pause] cho đời mình thêm thời gian để đổi thay.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q094", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 16/11 — Khác biệt vẫn có thể đồng hành", "text": "Ngày còn trẻ, ta dễ nghĩ điều mình thấy là toàn bộ câu chuyện.\nQua vài lần bị hiểu lầm, mới biết có những nỗi khó nói người ngoài chẳng nhìn ra.\nAi cũng mang theo một tuổi thơ, một hoàn cảnh và những lần vấp ngã khác nhau.\nTrước khi kết luận về ai, thử nghe họ nói hết một lần.\nBạn vẫn có quyền không đồng ý, vẫn được giữ giới hạn để bảo vệ mình.\nChỉ mong hôm nay ta bớt một lời phán xét, để có thêm chỗ cho sự cảm thông.", "author": "Tự biên", "note": "ngày 16/11 · lắng nghe · tôn trọng khác biệt", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; suy ngẫm, khiêm nhường; ấm áp khi nói về sự cảm thông.", "audio": [], "est": 45, "hook": "Chào ngày mới, Hôm nay là ngày 16/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười sáu tháng mười một. [pause]\n[reflective] Ngày còn trẻ, [short pause] ta dễ nghĩ điều mình thấy là toàn bộ câu chuyện. [pause]\nQua vài lần bị hiểu lầm, [short pause] mới biết có những nỗi khó nói người ngoài chẳng nhìn ra. [pause]\nAi cũng mang theo một tuổi thơ, một hoàn cảnh [short pause] và những lần vấp ngã khác nhau. [long pause]\n[warmly] Trước khi kết luận về ai, [short pause] thử nghe họ nói hết một lần. [pause]\nBạn vẫn có quyền không đồng ý, [short pause] vẫn được giữ giới hạn để bảo vệ mình. [pause]\n[softly] Chỉ mong hôm nay ta bớt một lời phán xét, [short pause] để có thêm chỗ cho sự cảm thông.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q095", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 17/11 — Tập trung vào hôm nay", "text": "Có khi ngồi cùng người thân mà lòng ta đã đi hết những lo lắng của tháng sau.\nBữa cơm qua rồi vẫn chẳng nhớ người trước mặt vừa kể chuyện gì.\nLo cho tương lai là điều cần thiết, nhưng những phút đang sống cũng sẽ thành kỷ niệm.\nHôm nay, thử ăn trọn một bữa và nghe trọn một câu chuyện.\nViệc ngày mai, dành một lúc để tính rồi trở về với điều trước mắt.\nMong sau này nhìn lại, bạn còn nhớ được những ngày mình đã sống, bên cạnh những ngày chỉ mải lo.", "author": "Tự biên", "note": "ngày 17/11 · hiện tại · tập trung", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; trầm lắng với nỗi lo; bình tâm, chậm rãi ở phần hiện tại.", "audio": [], "est": 46, "hook": "Chào ngày mới, Hôm nay là ngày 17/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười bảy tháng mười một. [pause]\n[reflective] Có khi ngồi cùng người thân mà lòng ta đã đi hết những lo lắng của tháng sau. [pause]\nBữa cơm qua rồi vẫn chẳng nhớ người trước mặt vừa kể chuyện gì. [pause]\nLo cho tương lai là điều cần thiết, [short pause] nhưng những phút đang sống cũng sẽ thành kỷ niệm. [long pause]\n[calm] Hôm nay, [short pause] thử ăn trọn một bữa và nghe trọn một câu chuyện. [pause]\nViệc ngày mai, [short pause] dành một lúc để tính rồi trở về với điều trước mắt. [pause]\n[softly] Mong sau này nhìn lại, [short pause] bạn còn nhớ được những ngày mình đã sống, bên cạnh những ngày chỉ mải lo.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q096", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 18/11 — Có người cùng đi", "text": "Sau những lần tự xoay xở đến kiệt sức, ta mới quý một người chịu ngồi lại cùng mình.\nHọ có thể chẳng giải quyết được chuyện gì, chỉ lắng nghe và hỏi bạn đã ăn chưa.\nVậy mà lòng nhẹ hơn, vì biết có người quan tâm cả lúc mình chẳng có gì để khoe.\nNếu đang có một người như thế, hãy giữ liên lạc bằng những điều giản dị.\nMột lời hỏi thăm cũng cần được gửi lại từ phía mình.\nMong hôm nay bạn có người để chia sẻ, và cũng là chỗ dựa vừa sức cho ai đó.", "author": "Tự biên", "note": "ngày 18/11 · đồng hành · sẻ chia", "mood": "biet-on", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; chân thành, ấm áp; nhấn nhẹ cảm giác có người đồng hành.", "audio": [], "est": 48, "hook": "Chào ngày mới, Hôm nay là ngày 18/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười tám tháng mười một. [pause]\n[reflective] Sau những lần tự xoay xở đến kiệt sức, [short pause] ta mới quý một người chịu ngồi lại cùng mình. [pause]\nHọ có thể chẳng giải quyết được chuyện gì, [short pause] chỉ lắng nghe và hỏi bạn đã ăn chưa. [pause]\n[warmly] Vậy mà lòng nhẹ hơn, [short pause] vì biết có người quan tâm cả lúc mình chẳng có gì để khoe. [long pause]\nNếu đang có một người như thế, [short pause] hãy giữ liên lạc bằng những điều giản dị. [pause]\nMột lời hỏi thăm cũng cần được gửi lại từ phía mình. [pause]\n[softly] Mong hôm nay bạn có người để chia sẻ, [short pause] và cũng là chỗ dựa vừa sức cho ai đó.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q097", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 19/11 — Những điều đừng để muộn", "text": "Ta từng nghĩ đợi bớt bận sẽ học điều mình thích, đợi dư dả sẽ sống cho mình hơn.\nNhưng hết việc này lại đến việc khác, những mong muốn nhỏ cứ lùi về phía sau.\nCó điều chẳng cần đợi một ngày hoàn hảo mới bắt đầu được.\nDành mười phút tập viết, đăng ký buổi học thử, hỏi thăm một công việc mình muốn làm.\nBắt đầu vừa sức để điều mong mỏi có một chỗ trong cuộc sống thật.\nMong nhiều năm nữa, bạn nhớ sáng nay là lúc mình đã thử, thay vì lại hẹn lần sau.", "author": "Tự biên", "note": "ngày 19/11 · điều còn dang dở · bắt đầu vừa sức", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; từng trải khi nhìn lại trì hoãn; khích lệ bình tĩnh, vừa sức.", "audio": [], "est": 47, "hook": "Chào ngày mới, Hôm nay là ngày 19/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày mười chín tháng mười một. [pause]\n[reflective] Ta từng nghĩ đợi bớt bận sẽ học điều mình thích, [short pause] đợi dư dả sẽ sống cho mình hơn. [pause]\nNhưng hết việc này lại đến việc khác, [short pause] những mong muốn nhỏ cứ lùi về phía sau. [long pause]\n[reassuring] Có điều chẳng cần đợi một ngày hoàn hảo mới bắt đầu được. [pause]\nDành mười phút tập viết, đăng ký buổi học thử, [short pause] hỏi thăm một công việc mình muốn làm. [pause]\nBắt đầu vừa sức để điều mong mỏi có một chỗ trong cuộc sống thật. [pause]\n[softly] Mong nhiều năm nữa, bạn nhớ sáng nay là lúc mình đã thử, [short pause] thay vì lại hẹn lần sau.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q098", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 20/11 — Luôn giữ tinh thần học hỏi", "text": "Có những bài học phải đi qua một lần mất mát ta mới chịu hiểu.\nHiểu lời hứa cần được giữ, hiểu người im lặng chưa chắc đã hết buồn.\nCũng có điều may mắn được nghe từ người đi trước, để mình bớt một lần vấp ngã.\nSống từng ấy năm, vẫn còn nhiều chuyện ta cần hỏi và nhiều điều cần học lại.\nThừa nhận mình chưa biết giúp cuộc trò chuyện có chỗ cho một cách nhìn khác.\nMong sáng nay bạn gặp một điều đáng học, rồi dùng nó để sống dễ chịu hơn với người và với mình.", "author": "Tự biên", "note": "ngày 20/11 · học hỏi · trưởng thành", "mood": "nghi-luc", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; suy tư, khiêm nhường; kết ấm áp và cởi mở.", "audio": [], "est": 48, "hook": "Chào ngày mới, Hôm nay là ngày 20/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày hai mươi tháng mười một. [pause]\n[reflective] Có những bài học phải đi qua một lần mất mát ta mới chịu hiểu. [pause]\nHiểu lời hứa cần được giữ, [short pause] hiểu người im lặng chưa chắc đã hết buồn. [pause]\nCũng có điều may mắn được nghe từ người đi trước, [short pause] để mình bớt một lần vấp ngã. [long pause]\n[warmly] Sống từng ấy năm, [short pause] vẫn còn nhiều chuyện ta cần hỏi và nhiều điều cần học lại. [pause]\nThừa nhận mình chưa biết giúp cuộc trò chuyện có chỗ cho một cách nhìn khác. [pause]\n[softly] Mong sáng nay bạn gặp một điều đáng học, [short pause] rồi dùng nó để sống dễ chịu hơn với người và với mình.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q099", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 21/11 — Lắng nghe tiếng nói bên trong", "text": "Có thời ta chọn mọi thứ theo lời người khác, rồi một ngày thấy mình xa lạ với cuộc sống đang có.\nCông việc được khen là tốt, con đường được bảo là đúng, nhưng lòng cứ mỏi mệt.\nLời khuyên đáng nghe, còn hoàn cảnh và sức chịu đựng của mình cũng cần được tính đến.\nTrước một quyết định, hãy hỏi điều ấy có hợp với cuộc sống mình muốn giữ.\nBạn được phép suy nghĩ kỹ và thay đổi từng chút khi có điều kiện.\nMong những lựa chọn từ hôm nay giúp bạn thấy gần với chính mình hơn.", "author": "Tự biên", "note": "ngày 21/11 · lắng nghe bản thân · lựa chọn", "mood": "binh-yen", "folders": ["Vid/hello_morning"], "extra": [], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn tự biên, không gán tác giả.", "voice": "Nam", "voice_why": "Giọng trích dẫn Nam — trầm, từng trải; thấu hiểu sự mỏi mệt; trấn an, tôn trọng lựa chọn riêng.", "audio": [], "est": 48, "hook": "Chào ngày mới, Hôm nay là ngày 21/11", "tts": "[calm] [low-pitched] [deliberate] Chào ngày mới. [short pause] Hôm nay là ngày hai mươi mốt tháng mười một. [pause]\n[reflective] Có thời ta chọn mọi thứ theo lời người khác, [short pause] rồi một ngày thấy mình xa lạ với cuộc sống đang có. [pause]\nCông việc được khen là tốt, con đường được bảo là đúng, [short pause] nhưng lòng cứ mỏi mệt. [long pause]\nLời khuyên đáng nghe, [short pause] còn hoàn cảnh và sức chịu đựng của mình cũng cần được tính đến. [pause]\n[reassuring] Trước một quyết định, [short pause] hãy hỏi điều ấy có hợp với cuộc sống mình muốn giữ. [pause]\nBạn được phép suy nghĩ kỹ và thay đổi từng chút khi có điều kiện. [pause]\n[softly] Mong những lựa chọn từ hôm nay giúp bạn thấy gần với chính mình hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "Q100", "kind": "Trích dẫn Ngày mới", "title": "Ngày mới 22/11 — Cho đi điều tốt đẹp", "text": "Khi từng được giúp lúc túng thiếu, ta hiểu một chút sẻ chia có thể quý đến thế nào.\nMột bữa ăn, một chỗ nghỉ, một người chỉ cách vượt qua buổi đầu bỡ ngỡ.\nSau này khá  if(p.exact&&!pool.length)pool.push(p.exact);
 if(p.exact)p.extra.forEach(f=>clipList(f).forEach(c=>pool.push(clipPath(f,c))));
 const suitable=pool.filter(rel=>!window.tvClipUsable||window.tvClipUsable(rel,p));
 if(!suitable.length){$('#o_'+p.id).textContent='Các clip gợi ý quá ngắn để dùng riêng. Mở “Tất cả clip” để chọn clip dài hơn hoặc ghép nhiều clip.';return}
 const r=suitable[Math.floor(Math.random()*suitable.length)];
 $('#o_'+p.id).innerHTML=`<div class="pick">${esc(r)}</div>`;copy(r)}
async function copy(rel){try{if(!BASE){const j=await (await fetch('/api/root')).json();BASE=j.root.replace(/\/$/,'')+'/'}await navigator.clipboard.writeText(BASE+rel)}catch(e){}}
function copyText(value){try{navigator.clipboard.writeText(value)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-k],[data-f],[data-rand],[data-copy],[data-copy-text],[data-open],[data-t],[data-v],[data-play],[data-music],[data-all]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;mood='';kind='';voice='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#kinds').style.display=$('#voices').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#unusedl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#longl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#kinds').style.display=$('#voices').style.display=((tab=='tho'||tab=='dub')||tab=='bo')?'':'none';if(tab=='bo')$('#kinds').style.display='none';render()}
 else if(t.dataset.v){voice=voice==t.dataset.v?'':t.dataset.v;render()}
 else if(t.dataset.play)play(t.dataset.play,t.dataset.pk);
 else if(t.dataset.music){const p=findP(p=>p.id==t.dataset.music),ts=musicFor(p.mood),x=ts[Math.floor(Math.random()*ts.length)];$('#m_'+p.id).innerHTML=musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`}
 else if(t.dataset.all){const p=findP(p=>p.id==t.dataset.all);$('#m_'+p.id).innerHTML=musicFor(p.mood).map(x=>musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`).join('')}
 else if(t.dataset.m!==undefined){mood=t.dataset.m;render()}
 else if(t.dataset.k){kind=kind==t.dataset.k?'':t.dataset.k;render()}
 else if(t.dataset.f)showClips(t.dataset.p,t.dataset.f);
 else if(t.dataset.rand)pick(findP(p=>p.id==t.dataset.rand));
 else if(t.dataset.open)window.open(encodeURI(t.dataset.open));
 else if(t.dataset.copy){e.preventDefault();copy(t.dataset.copy);t.style.color='var(--acc)'}
 else if(t.dataset.copyText){e.preventDefault();copyText(t.dataset.copyText);t.style.color='var(--acc)'}});
document.addEventListener('change',e=>{if(e.target.dataset.u){used[e.target.dataset.u]=e.target.checked;save();render()}});
