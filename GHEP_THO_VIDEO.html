người đi đã khuất sau dặm dài. Cụ Nguyễn Du kể. [long pause]\nNgười lên ngựa kẻ chia bào, [pause]\nRừng phong thu đã nhuốm màu quan san. [pause]\nDặm hồng bụi cuốn chinh an, [pause]\nTrông người đã khuất mấy ngàn dâu xanh. [pause]\nNgười về chiếc bóng năm canh, [pause]\nKẻ đi muôn dặm một mình xa xôi. [pause]\nVầng trăng ai xẻ làm đôi, [pause]\nNửa in gối chiếc, [short pause] nửa soi dặm trường.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 444, "file": "Long-tieng/elevenlabs/Q038_Nguoi-len-ngua-ke-chia-bao.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q040", "kind": "Thơ", "title": "Nước non nặng một lời thề", "text": "Nước non nặng một lời thề,\nNước đi đi mãi không về cùng non.\nNhớ lời nguyện nước thề non,\nNước đi chưa lại, non còn đứng không.\nNon cao những ngóng cùng trông,\nSuối khô dòng lệ chờ mong tháng ngày.\nXương mai một nắm hao gầy,\nTóc mây một mái đã đầy tuyết sương!\nTrời tây ngả bóng tà dương,\nCàng phơi vẻ ngọc nét vàng phôi pha.", "author": "Tản Đà (1889–1939), “Thề non nước” (10 câu đầu / 22 câu)", "note": "chờ đợi, thề nguyền", "mood": "doi-cho", "folders": ["02_Bien-song-nuoc", "01_Thien-nhien"], "extra": ["05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Thề_non_nước_(thơ)", "vnote": "Wikisource ghi nhiều dị bản; dùng cách đọc phổ biến trong SGK: lời, Xương mai, Trời tây ngả bóng. Bản Wikisource chép: nhời, Sương mai, Giời tây chiếu bóng. Dấu câu cuối dòng được chuẩn hoá.", "voice": "Nam", "voice_why": "lời người đàn ông", "audio": [], "est": 35, "stem": null, "hook": "Có người chỉ hứa một câu, mà mình chờ cả một thanh xuân. Nếu bạn từng như thế, thì nghe mấy câu này của cụ Tản Đà nhé.", "tts": "[natural, reflective, steady pace]\nCó người chỉ hứa một câu, mà mình chờ cả một thanh xuân. [short pause]\nNếu bạn từng như thế, thì nghe mấy câu này của cụ Tản Đà nhé. [pause]\n\nNước non [short pause] nặng một lời thề, [pause]\nNước đi đi mãi [short pause] không về cùng non. [pause]\nNhớ lời [short pause] nguyện nước thề non, [pause]\nNước đi chưa lại, [short pause] non còn đứng không. [pause]\n\nNon cao [short pause] những ngóng cùng trông, [pause]\nSuối khô dòng lệ [short pause] chờ mong tháng ngày. [pause]\nXương mai [short pause] một nắm hao gầy, [pause]\nTóc mây một mái [short pause] đã đầy tuyết sương. [pause]\n\nTrời tây [short pause] ngả bóng tà dương, [pause]\nCàng phơi vẻ ngọc [short pause] nét vàng phôi pha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 716, "file": "Long-tieng/elevenlabs/Q040_Nuoc-non-nang-mot-loi-the.mp3", "date": "2026-10-21"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q041", "kind": "Thơ", "title": "Sao anh không về chơi thôn Vĩ?", "text": "Sao anh không về chơi thôn Vĩ?\nNhìn nắng hàng cau nắng mới lên,\nVườn ai mướt quá xanh như ngọc,\nLá trúc che ngang mặt chữ điền.\nGió theo lối gió, mây đường mây,\nDòng nước buồn thiu, hoa bắp lay.\nThuyền ai đậu bến sông trăng đó,\nCó chở trăng về kịp tối nay?\nMơ khách đường xa, khách đường xa,\nÁo em trắng quá nhìn không ra...\nỞ đây sương khói mờ nhân ảnh,\nAi biết tình ai có đậm đà?", "author": "Hàn Mặc Tử (1912–1940), “Đây thôn Vĩ Dạ” (đủ 12 câu, 3 khổ)", "note": "sáng sớm, mong nhớ", "mood": "doi-cho", "folders": ["01_Thien-nhien", "18_Binh-minh-hoang-hon"], "extra": ["02_Bien-song-nuoc", "05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Đây_thôn_Vĩ_Dạ", "vnote": "Wikisource chép từ SGK Ngữ văn 11, NXB Giáo dục, 2007. “sông trăng” viết thường theo bản này. Dấu câu cuối dòng được chuẩn hoá. Q042, Q043 là khổ 2, 3 của cùng bài (đã gộp).", "voice": "Nữ", "voice_why": "lời người con gái / người phụ nữ", "audio": [], "est": 40, "stem": null, "hook": "Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn:", "tts": "[softly] Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn. [long pause]\nSao anh không về chơi thôn Vĩ? [pause]\nNhìn nắng hàng cau nắng mới lên, [pause]\nVườn ai mướt quá xanh như ngọc, [pause]\nLá trúc che ngang mặt chữ điền. [pause]\nGió theo lối gió, [short pause] mây đường mây, [pause]\nDòng nước buồn thiu, [short pause] hoa bắp lay. [pause]\nThuyền ai đậu bến sông trăng đó, [pause]\nCó chở trăng về kịp tối nay? [pause]\nMơ khách đường xa, [short pause] khách đường xa, [pause]\nÁo em trắng quá nhìn không ra. [pause]\nỞ đây sương khói mờ nhân ảnh, [pause]\nAi biết tình ai có đậm đà?", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 616, "file": "Long-tieng/elevenlabs/Q041_Sao-anh-khong-ve-choi-thon-Vi.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q044", "kind": "Thơ", "title": "Thôn Đoài ngồi nhớ thôn Đông", "text": "Thôn Đoài ngồi nhớ thôn Đông,\nMột người chín nhớ mười mong một người.\nGió mưa là bệnh của giời,\nTương tư là bệnh của tôi yêu nàng.\nHai thôn chung lại một làng,\nCớ sao bên ấy chẳng sang bên này?\nNgày qua ngày lại qua ngày,\nLá xanh nhuộm đã thành cây lá vàng.\nBảo rằng cách trở đò giang,\nKhông sang là chẳng đường sang đã đành.\nNhưng đây cách một đầu đình,\nCó xa xôi mấy cho tình xa xôi...", "author": "Nguyễn Bính (1918–1966), “Tương tư” (12 câu đầu / 20 câu)", "note": "tương tư, mưa", "mood": "tinh-yeu", "folders": ["13_Mua-cua-so"], "extra": ["Chill_100_9x16/02_Hoa"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tương_tư", "vnote": "In trong tập “Lỡ bước sang ngang” (Hương Sơn, 1940). Wikisource ghi dị bản “Nắng mưa… trời, trầu”; dùng “Gió mưa… giời”. Dấu câu cuối dòng được chuẩn hoá.", "voice": "Nam", "voice_why": "lời người đàn ông", "audio": [], "est": 40, "stem": null, "hook": "Có ai từng nhớ một người, mà chẳng dám nói thành lời? Nguyễn Bính đã nói giúp bạn rồi đấy:", "tts": "[softly] Có ai từng nhớ một người, mà chẳng dám nói thành lời? Nguyễn Bính đã nói giúp bạn rồi đấy. [long pause]\nThôn Đoài ngồi nhớ thôn Đông, [pause]\nMột người chín nhớ mười mong một người. [pause]\nGió mưa là bệnh của giời, [pause]\nTương tư là bệnh của tôi yêu nàng. [pause]\nHai thôn chung lại một làng, [pause]\nCớ sao bên ấy chẳng sang bên này? [pause]\nNgày qua ngày lại qua ngày, [pause]\nLá xanh nhuộm đã thành cây lá vàng. [pause]\nBảo rằng cách trở đò giang, [pause]\nKhông sang là chẳng đường sang đã đành. [pause]\nNhưng đây cách một đầu đình, [pause]\nCó xa xôi mấy cho tình xa xôi.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 586, "file": "Long-tieng/elevenlabs/Q044_Thon-Doai-ngoi-nho-thon-Dong.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "S11", "kind": "Có nguồn", "title": "Trời mưa lác đác ruộng dâu", "text": "Trời mưa lác đác ruộng dâu,\nCái nón đội đầu, cái thúng cắp tay;\nBước chân xuống hái dâu nầy,\nNuôi tằm cho lớn, mong ngày ươm tơ.\nThương em chút phận ngây thơ,\nLầm than đã trải, nắng mưa đã từng.\nXa xuôi ai có tỏ chừng?\nGian nan tân khổ, ta đừng quên nhau!", "author": "Dân gian Việt Nam", "note": "Thương người, nắng mưa", "mood": "tinh-yeu", "folders": [], "extra": ["13_Mua-cua-so", "Chill_100_9x16/02_Hoa"], "exact": "Videos/Viet_Nam_Chill_20_40s/Ninh_Binh/19_Ninh_Binh_Nui_va_song_trong_suong_40s_9x16.mp4", "stem": "11_Troi_mua_lac_dac_ruong_dau", "source": "https://vi.wikisource.org/wiki/Theo_tục_ngữ_phong_dao,_xét_về_sự_sanh_hoạt_của_phụ_nữ_nước_ta", "voice": "Nữ", "voice_why": "lời người con gái / người phụ nữ", "audio": [], "est": 30, "url": "https://vi.wikisource.org/wiki/Theo_tục_ngữ_phong_dao,_xét_về_sự_sanh_hoạt_của_phụ_nữ_nước_ta", "files": null, "vnote": null, "hook": "Các cụ nhà ta không hứa chuyện giàu sang, mà chỉ dặn nhau: gian nan rồi, đừng quên nhau!", "tts": "[softly] Các cụ nhà ta không hứa chuyện giàu sang, mà chỉ dặn nhau: gian nan rồi, đừng quên nhau. [long pause]\nTrời mưa lác đác ruộng dâu, [pause]\nCái nón đội đầu, [short pause] cái thúng cắp tay, [pause]\nBước chân xuống hái dâu nầy, [pause]\nNuôi tằm cho lớn, [short pause] mong ngày ươm tơ. [pause]\nThương em chút phận ngây thơ, [pause]\nLầm than đã trải, [short pause] nắng mưa đã từng. [pause]\nXa xuôi ai có tỏ chừng? [pause]\nGian nan tân khổ, [short pause] ta đừng quên nhau.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 478, "file": "Long-tieng/elevenlabs/S11_Troi-mua-lac-dac-ruong-dau.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L10", "kind": "Thơ", "title": "Kiều: đêm thề nguyền", "text": "Vầng trăng vằng vặc giữa trời,\nĐinh ninh hai mặt một lời song song.\nTóc tơ căn vặn tấc lòng,\nTrăm năm tạc một chữ đồng đến xương.\nChén hà sánh giọng quỳnh tương,\nDải là hương lộn bình gương bóng lồng.\nSinh rằng: Gió mát trăng trong,\nBấy lâu nay một chút lòng chưa cam.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "Kim – Kiều thề nguyền", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng:", "tts": "[softly] Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng. [long pause]\nVầng trăng vằng vặc giữa trời, [pause]\nĐinh ninh hai mặt một lời song song. [pause]\nTóc tơ căn vặn tấc lòng, [pause]\nTrăm năm tạc một chữ đồng đến xương. [pause]\nChén hà sánh giọng quỳnh tương, [pause]\nDải là hương lộn bình gương bóng lồng. [pause]\nSinh rằng: Gió mát trăng trong, [pause]\nBấy lâu nay một chút lòng chưa cam.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 415, "file": "Long-tieng/elevenlabs/L10_Kieu-dem-the-nguyen.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L11", "kind": "Thơ", "title": "Kiều: lần đầu gặp Kim Trọng", "text": "Người quốc sắc, kẻ thiên tài,\nTình trong như đã, mặt ngoài còn e.\nChập chờn cơn tỉnh cơn mê.\nRốn ngồi chẳng tiện, dứt về chỉn khôn.\nBóng tà như giục cơn buồn,\nKhách đà lên ngựa, người còn nghé theo.\nDưới cầu nước chảy trong veo,\nBên cầu tơ liễu bóng chiều thướt tha.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "gặp là nhớ, hợp hook \"một ánh nhìn\"", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này:", "tts": "[softly] Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này. [long pause]\nNgười quốc sắc, [short pause] kẻ thiên tài, [pause]\nTình trong như đã, [short pause] mặt ngoài còn e. [pause]\nChập chờn cơn tỉnh cơn mê. [pause]\nRốn ngồi chẳng tiện, [short pause] dứt về chỉn khôn. [pause]\nBóng tà như giục cơn buồn, [pause]\nKhách đà lên ngựa, [short pause] người còn nghé theo. [pause]\nDưới cầu nước chảy trong veo, [pause]\nBên cầu tơ liễu bóng chiều thướt tha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 488, "file": "Long-tieng/elevenlabs/L11_Kieu-lan-dau-gap-Kim-Trong.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C02", "kind": "Ca dao", "title": "Vào vườn hái quả cau xanh", "text": "Vào vườn hái quả cau xanh,\nBổ ra làm sáu, mời anh xơi trầu.\nTrầu này têm những vôi tàu,\nGiữa đệm cát cánh, hai đầu quế cay.\nTrầu này ăn thiệt là say,\nDù mặn, dù nhạt, dù cay, dù nồng.\nDù chăng nên đạo vợ chồng.\nXơi dăm ba miếng kẻo lòng nhớ thương!", "author": "Ca dao (Wikisource)", "note": "8 dòng", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Con_gái_ngỏ_ý_với_con_trai", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương:", "tts": "[softly] Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương. [long pause]\nVào vườn hái quả cau xanh, [pause]\nBổ ra làm sáu, [short pause] mời anh xơi trầu. [pause]\nTrầu này têm những vôi tàu, [pause]\nGiữa đệm cát cánh, [short pause] hai đầu quế cay. [pause]\nTrầu này ăn thiệt là say, [pause]\nDù mặn, [short pause] dù nhạt, [short pause] dù cay, [short pause] dù nồng. [pause]\nDù chăng nên đạo vợ chồng. [pause]\nXơi dăm ba miếng kẻo lòng nhớ thương.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 480, "file": "Long-tieng/elevenlabs/C02_Vao-vuon-hai-qua-cau-xanh.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C03", "kind": "Ca dao", "title": "Trèo lên cây bưởi hái hoa", "text": "Trèo lên cây bưởi hái hoa,\nBước xuống vườn cà hái nụ tầm-xuân.\nBa đồng một mớ trầu cay,\nSao anh chẳng hỏi những ngày còn không?\nBây giờ em đã có chồng,\nNhư chim vào lồng, như cá cắn câu.\nCá cắn câu, biết đâu mà gỡ;\nChim vào lồng, biết thuở nào ra!", "author": "Ca dao (Wikisource)", "note": "đã bỏ một dòng khuyết trên trang nguồn", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tiếc_sự_biết_nhau_quá_chậm", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này:", "tts": "[softly] Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này. [long pause]\nTrèo lên cây bưởi hái hoa, [pause]\nBước xuống vườn cà hái nụ tầm-xuân. [pause]\nBa đồng một mớ trầu cay, [pause]\nSao anh chẳng hỏi những ngày còn không? [pause]\nBây giờ em đã có chồng, [pause]\nNhư chim vào lồng, [short pause] như cá cắn câu. [pause]\nCá cắn câu, [short pause] biết đâu mà gỡ, [pause]\nChim vào lồng, [short pause] biết thuở nào ra.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 438, "file": "Long-tieng/elevenlabs/C03_Treo-len-cay-buoi-hai-hoa.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C04", "kind": "Ca dao", "title": "Đôi duyên ta như loan với phượng", "text": "Đôi duyên ta như loan với phượng,\nNỡ lòng nào để phượng lìa cây.\nMuốn cho có đó có đây,\nAi làm nên nỗi nước này, chàng ôi!\nThà rằng chẳng biết thì thôi,\nBiết chi gối chiếc lẻ-loi thêm phiền.", "author": "Ca dao (Wikisource)", "note": "6 dòng", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Nỗi_ly_biệt", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này:", "tts": "[softly] Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này. [long pause]\nĐôi duyên ta như loan với phượng, [pause]\nNỡ lòng nào để phượng lìa cây. [pause]\nMuốn cho có đó có đây, [pause]\nAi làm nên nỗi nước này, [short pause] chàng ôi. [pause]\nThà rằng chẳng biết thì thôi, [pause]\nBiết chi gối chiếc lẻ-loi thêm phiền.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 339, "file": "Long-tieng/elevenlabs/C04_Doi-duyen-ta-nhu-loan-voi-phuong.mp3", "date": "2026-10-16"}, "tpl": "Thơ Hoài Cổ"}, {"id": "K02", "kind": "Trích dẫn", "title": "Dịu dàng với chính mình", "text": "Người ta thường khen bạn mạnh mẽ, nhưng ít ai biết bạn đã phải trải qua những đêm dài như thế nào.\nCó những nỗi buồn không thể kể, có những giọt nước mắt phải tự mình lau.\nMong rằng sau tất cả, bạn sẽ học được cách dịu dàng với chính mình.\nHãy ôm lấy bản thân như cách bạn vẫn ôm người mình thương.\nBạn đã đi một quãng đường rất dài, và bạn xứng đáng được nghỉ ngơi.", "author": "Không rõ", "note": "chữa lành, dịu dàng", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 32, "hook": "", "tts": "[softly] Người ta thường khen bạn mạnh mẽ, nhưng ít ai biết bạn đã phải trải qua những đêm dài như thế nào. [pause]\nCó những nỗi buồn không thể kể, có những giọt nước mắt phải tự mình lau. [long pause]\nMong rằng sau tất cả, bạn sẽ học được cách dịu dàng với chính mình. [pause]\nHãy ôm lấy bản thân như cách bạn vẫn ôm người mình thương. [pause]\nBạn đã đi một quãng đường rất dài, và bạn xứng đáng được nghỉ ngơi.", "done": {"voice_id": "O4GJDPajhRb6MxWUMf7V", "model": "eleven_v4", "chars": 412, "file": "Long-tieng/elevenlabs/K02_Diu-dang-voi-chinh-minh.mp3", "date": "2026-10-19"}, "tpl": "Trích dẫn"}, {"id": "K01", "kind": "Trích dẫn", "title": "Một khoảng lặng để sống thật", "text": "Có những ngày, bạn chẳng muốn cố gắng thêm điều gì nữa.\nChỉ muốn ngồi yên, không phải giải thích, không phải gồng mình mạnh mẽ.\nVà điều đó cũng chẳng sao cả.\nBởi đôi khi, điều chúng ta cần nhất không phải là một lời khuyên, mà là một khoảng lặng để được sống thật với cảm xúc của mình.\nVậy nên hôm nay, nếu muốn nghỉ ngơi, hãy cứ nghỉ, ngày mai ta sẽ lại bước đi nhẹ nhàng hơn.", "author": "Không rõ", "note": "chữa lành, khoảng lặng", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Có những ngày, bạn chẳng muốn cố gắng thêm điều gì nữa. [pause]\nChỉ muốn ngồi yên, không phải giải thích, không phải gồng mình mạnh mẽ. [long pause]\nVà điều đó cũng chẳng sao cả. [pause]\nBởi đôi khi, điều chúng ta cần nhất không phải là một lời khuyên, mà là một khoảng lặng để được sống thật với cảm xúc của mình. [pause]\nVậy nên hôm nay, nếu muốn nghỉ ngơi, hãy cứ nghỉ, ngày mai ta sẽ lại bước đi nhẹ nhàng hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "K03", "kind": "Trích dẫn", "title": "Bước nhỏ cũng đủ qua ngày giông bão", "text": "Nếu hôm nay bạn thấy mình chẳng làm được điều gì đáng kể, hãy nhớ rằng có những ngày, chỉ riêng việc thức dậy và tiếp tục sống đã là một sự cố gắng.\nKhông phải bước chân nào cũng cần thật dài.\nCó những bước rất nhỏ, nhưng cũng đủ đưa ta qua một ngày giông bão.\nVậy nên đừng tự trách mình nữa.\nHôm nay bạn đã làm đủ rồi, ngày mai hãy cứ bước tiếp, thật chậm cũng được.", "author": "Không rõ", "note": "chữa lành, tiếp tục sống", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Nếu hôm nay bạn thấy mình chẳng làm được điều gì đáng kể, hãy nhớ rằng có những ngày, chỉ riêng việc thức dậy và tiếp tục sống đã là một sự cố gắng. [pause]\nKhông phải bước chân nào cũng cần thật dài. [long pause]\nCó những bước rất nhỏ, nhưng cũng đủ đưa ta qua một ngày giông bão. [pause]\nVậy nên đừng tự trách mình nữa. [pause]\nHôm nay bạn đã làm đủ rồi, ngày mai hãy cứ bước tiếp, thật chậm cũng được.", "done": null, "tpl": "Trích dẫn"}, {"id": "K04", "kind": "Trích dẫn", "title": "Không có mùa mưa nào kéo dài mãi", "text": "Cuộc đời không phải ngày nào cũng có nắng.\nSẽ có những cơn mưa đến bất chợt, khiến lòng người ướt lạnh.\nNhưng bạn biết không, không có mùa mưa nào kéo dài mãi mãi.\nRồi sẽ đến một buổi sáng, bạn thức dậy và nhận ra lòng mình đã nhẹ hơn ngày hôm qua rất nhiều.\nCho đến lúc ấy, cứ để mưa rơi, cứ để lòng được buồn.\nBầu trời nào rồi cũng sáng, và bạn cũng sẽ như vậy.", "author": "Không rõ", "note": "chữa lành, sau cơn mưa", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Cuộc đời không phải ngày nào cũng có nắng. [pause]\nSẽ có những cơn mưa đến bất chợt, khiến lòng người ướt lạnh. [long pause]\nNhưng bạn biết không, không có mùa mưa nào kéo dài mãi mãi. [pause]\nRồi sẽ đến một buổi sáng, bạn thức dậy và nhận ra lòng mình đã nhẹ hơn ngày hôm qua rất nhiều. [pause]\nCho đến lúc ấy, cứ để mưa rơi, cứ để lòng được buồn. [pause]\nBầu trời nào rồi cũng sáng, và bạn cũng sẽ như vậy.", "done": null, "tpl": "Trích dẫn"}, {"id": "K05", "kind": "Trích dẫn", "title": "Thương lấy chính mình", "text": "Có những người, những chuyện, chúng ta đã từng nghĩ sẽ giữ được cả đời.\nNhưng rồi năm tháng dạy ta hiểu rằng, không phải điều gì đẹp đẽ cũng có thể ở lại.\nBuông tay đôi khi không phải vì hết thương, mà vì ta đã đến lúc phải thương lấy chính mình.\nNhững điều đẹp đẽ ấy vẫn còn trong ký ức, chỉ là không còn ở bên ta.\nHãy cảm ơn vì đã từng gặp nhau, rồi nhẹ nhàng đi tiếp.", "author": "Không rõ", "note": "chữa lành, buông tay", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 34, "hook": "", "tts": "[softly] Có những người, những chuyện, chúng ta đã từng nghĩ sẽ giữ được cả đời. [pause]\nNhưng rồi năm tháng dạy ta hiểu rằng, không phải điều gì đẹp đẽ cũng có thể ở lại. [long pause]\nBuông tay đôi khi không phải vì hết thương, mà vì ta đã đến lúc phải thương lấy chính mình. [pause]\nNhững điều đẹp đẽ ấy vẫn còn trong ký ức, chỉ là không còn ở bên ta. [pause]\nHãy cảm ơn vì đã từng gặp nhau, rồi nhẹ nhàng đi tiếp.", "done": {"voice_id": "O4GJDPajhRb6MxWUMf7V", "model": "eleven_v4", "chars": 416, "file": "Long-tieng/elevenlabs/K05_Thuong-lay-chinh-minh.mp3", "date": "2026-10-19"}, "tpl": "Trích dẫn"}, {"id": "K06", "kind": "Trích dẫn", "title": "Cảm ơn vì đã không bỏ rơi chính mình", "text": "Cảm ơn bạn vì đã không bỏ rơi chính mình trong những ngày tăm tối nhất.\nCảm ơn vì dù từng thất vọng, tổn thương, bạn vẫn chọn sống tử tế.\nMong những tháng ngày phía trước sẽ dịu dàng hơn, và mong bạn tìm được hạnh phúc mà mình luôn xứng đáng có được.\nNgủ ngon nhé, người vẫn luôn cố gắng.\nNgày mai, bạn sẽ lại là một phiên bản bình yên hơn của chính mình.", "author": "Không rõ", "note": "chữa lành, lời cảm ơn", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 31, "hook": "", "tts": "[softly] Cảm ơn bạn vì đã không bỏ rơi chính mình trong những ngày tăm tối nhất. [pause]\nCảm ơn vì dù từng thất vọng, tổn thương, bạn vẫn chọn sống tử tế. [long pause]\nMong những tháng ngày phía trước sẽ dịu dàng hơn, và mong bạn tìm được hạnh phúc mà mình luôn xứng đáng có được. [pause]\nNgủ ngon nhé, người vẫn luôn cố gắng. [pause]\nNgày mai, bạn sẽ lại là một phiên bản bình yên hơn của chính mình.", "done": null, "tpl": "Trích dẫn"}, {"id": "K07", "kind": "Trích dẫn", "title": "Bình yên bắt đầu từ cách ta nhìn", "text": "Điều làm ta xao động nhiều khi không phải là sự việc, mà là cách ta nhìn sự việc ấy.\nKhi không thể thay đổi điều đang xảy ra, ta vẫn có thể chọn cách mình đáp lại.\nHãy đưa tâm trí trở về với điều nhỏ bé mà mình có thể làm ngay lúc này.\nMột ý nghĩ bình tĩnh sẽ mở ra một con đường bình tĩnh.\nBình yên đôi khi bắt đầu từ việc thôi tranh cãi với những gì đã xảy ra.", "author": "Phỏng ý Marcus Aurelius", "note": "bình tâm, góc nhìn", "mood": "binh-yen", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "https://www.gutenberg.org/ebooks/2680", "vnote": "Bản phỏng ý tiếng Việt từ Meditations của Marcus Aurelius, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 34, "hook": "", "tts": "[softly] Điều làm ta xao động nhiều khi không phải là sự việc, mà là cách ta nhìn sự việc ấy. [pause]\nKhi không thể thay đổi điều đang xảy ra, ta vẫn có thể chọn cách mình đáp lại. [long pause]\nHãy đưa tâm trí trở về với điều nhỏ bé mà mình có thể làm ngay lúc này. [pause]\nMột ý nghĩ bình tĩnh sẽ mở ra một con đường bình tĩnh. [pause]\nBình yên đôi khi bắt đầu từ việc thôi tranh cãi với những gì đã xảy ra.", "done": null, "tpl": "Trích dẫn"}, {"id": "K08", "kind": "Trích dẫn", "title": "Đừng đau khổ hai lần", "text": "Có những điều chưa từng xảy ra, nhưng ta đã âm thầm chịu đựng chúng rất nhiều lần trong tưởng tượng.\nTa sợ một ngày mai chưa đến, rồi mang nỗi sợ ấy làm nặng cả hôm nay.\nNếu khó khăn thật sự xuất hiện, ta sẽ đối diện khi nó đến.\nCòn lúc này, hãy để lòng mình được nghỉ.\nĐừng bắt bản thân đau khổ hai lần vì một điều có thể sẽ không bao giờ xảy ra.", "author": "Phỏng ý Seneca", "note": "lo âu, sống hiện tại", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://www.gutenberg.org/files/59025/59025-h/59025-h.htm", "vnote": "Bản phỏng ý tiếng Việt từ tư tưởng Khắc kỷ của Seneca, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 32, "hook": "", "tts": "[softly] Có những điều chưa từng xảy ra, nhưng ta đã âm thầm chịu đựng chúng rất nhiều lần trong tưởng tượng. [pause]\nTa sợ một ngày mai chưa đến, rồi mang nỗi sợ ấy làm nặng cả hôm nay. [long pause]\nNếu khó khăn thật sự xuất hiện, ta sẽ đối diện khi nó đến. [pause]\nCòn lúc này, hãy để lòng mình được nghỉ. [pause]\nĐừng bắt bản thân đau khổ hai lần vì một điều có thể sẽ không bao giờ xảy ra.", "done": null, "tpl": "Trích dẫn"}, {"id": "K09", "kind": "Trích dẫn", "title": "Nơi nỗi buồn từng đi qua", "text": "Niềm vui và nỗi buồn không đứng ở hai phía xa nhau như ta vẫn nghĩ.\nCó khi chính nơi từng làm ta đau lại trở thành nơi ta hiểu sâu nhất về hạnh phúc.\nChiếc lòng đã từng chứa nước mắt cũng có thể chứa một nụ cười rất đầy.\nVì vậy, đừng xấu hổ về những ngày mình yếu lòng.\nChúng đang lặng lẽ làm trái tim bạn rộng hơn.", "author": "Phỏng ý Kahlil Gibran", "note": "nỗi buồn, trưởng thành", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://www.gutenberg.org/files/58585/58585-h/58585-h.htm#link_joy", "vnote": "Bản phỏng ý tiếng Việt từ chương On Joy and Sorrow trong The Prophet, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 29, "hook": "", "tts": "[softly] Niềm vui và nỗi buồn không đứng ở hai phía xa nhau như ta vẫn nghĩ. [pause]\nCó khi chính nơi từng làm ta đau lại trở thành nơi ta hiểu sâu nhất về hạnh phúc. [long pause]\nChiếc lòng đã từng chứa nước mắt cũng có thể chứa một nụ cười rất đầy. [pause]\nVì vậy, đừng xấu hổ về những ngày mình yếu lòng. [pause]\nChúng đang lặng lẽ làm trái tim bạn rộng hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "K10", "kind": "Trích dẫn", "title": "Những hạt mầm vẫn lớn lên", "text": "Có những ngày ta tưởng mình đã để thời gian trôi qua vô ích.\nTa mệt mỏi, nằm yên và nghĩ rằng mọi thứ trong đời đều ngừng lại.\nNhưng sâu trong những khoảng lặng ấy, có những hạt mầm vẫn đang lớn lên.\nKhông phải sự đổi thay nào cũng tạo ra tiếng động.\nRồi một sớm mai, bạn sẽ nhận ra khu vườn trong mình đã nở hoa từ lúc nào.", "author": "Phỏng ý Rabindranath Tagore", "note": "thời gian, hồi phục", "mood": "binh-yen", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "https://www.gutenberg.org/cache/epub/7164/pg7164-images.html#chap82", "vnote": "Bản phỏng ý tiếng Việt từ bài 81, Gitanjali của Rabindranath Tagore, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "", "tts": "[softly] Có những ngày ta tưởng mình đã để thời gian trôi qua vô ích. [pause]\nTa mệt mỏi, nằm yên và nghĩ rằng mọi thứ trong đời đều ngừng lại. [long pause]\nNhưng sâu trong những khoảng lặng ấy, có những hạt mầm vẫn đang lớn lên. [pause]\nKhông phải sự đổi thay nào cũng tạo ra tiếng động. [pause]\nRồi một sớm mai, bạn sẽ nhận ra khu vườn trong mình đã nở hoa từ lúc nào.", "done": null, "tpl": "Trích dẫn"}, {"id": "K11", "kind": "Trích dẫn", "title": "Chỉ cần sống tốt phần hôm nay", "text": "Bạn không cần giải quyết cả cuộc đời trong một buổi tối.\nCũng không cần trở thành một người hoàn hảo trước khi ngày mai bắt đầu.\nHãy làm tốt việc đang ở trước mặt, bằng tất cả sự tử tế và bình tâm mà bạn có.\nMột ngày được sống trọn sẽ nối vào một ngày khác.\nCuộc đời lớn lao cuối cùng cũng được tạo nên từ những việc nhỏ như vậy.", "author": "Phỏng ý Marcus Aurelius", "note": "hiện tại, bước nhỏ", "mood": "nghi-luc", "folders": ["09_Hanh-trinh-duong-xa", "01_Thien-nhien"], "extra": ["18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://www.gutenberg.org/ebooks/2680", "vnote": "Bản phỏng ý tiếng Việt từ Meditations của Marcus Aurelius, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "", "tts": "[softly] Bạn không cần giải quyết cả cuộc đời trong một buổi tối. [pause]\nCũng không cần trở thành một người hoàn hảo trước khi ngày mai bắt đầu. [long pause]\nHãy làm tốt việc đang ở trước mặt, bằng tất cả sự tử tế và bình tâm mà bạn có. [pause]\nMột ngày được sống trọn sẽ nối vào một ngày khác. [pause]\nCuộc đời lớn lao cuối cùng cũng được tạo nên từ những việc nhỏ như vậy.", "done": null, "tpl": "Trích dẫn"}, {"id": "K12", "kind": "Trích dẫn", "title": "Một người bạn biết lắng nghe", "text": "Có những người bạn không cần nói điều gì thật lớn lao, chỉ cần ngồi cạnh cũng khiến lòng ta dịu lại.\nỞ bên họ, ta không sợ một lời không đồng ý và cũng không phải che giấu sự im lặng.\nNgay cả khi xa nhau, điều đẹp nhất nơi họ đôi khi lại hiện lên rõ hơn.\nTình bạn không lấp đầy thời gian trống.\nTình bạn làm những giờ ta đang sống trở nên sâu sắc hơn.", "author": "Phỏng ý Kahlil Gibran", "note": "tình bạn, thấu hiểu", "mood": "biet-on", "folders": ["07_Ca-phe-tra", "20_Cafe-sach-vang"], "extra": ["16_Nguoi-gia-ky-uc"], "exact": null, "files": null, "url": "https://www.gutenberg.org/files/58585/58585-h/58585-h.htm#link_friendship", "vnote": "Bản phỏng ý tiếng Việt từ chương On Friendship trong The Prophet, không phải bản dịch nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 32, "hook": "", "tts": "[softly] Có những người bạn không cần nói điều gì thật lớn lao, chỉ cần ngồi cạnh cũng khiến lòng ta dịu lại. [pause]\nỞ bên họ, ta không sợ một lời không đồng ý và cũng không phải che giấu sự im lặng. [long pause]\nNgay cả khi xa nhau, điều đẹp nhất nơi họ đôi khi lại hiện lên rõ hơn. [pause]\nTình bạn không lấp đầy thời gian trống. [pause]\nTình bạn làm những giờ ta đang sống trở nên sâu sắc hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "K13", "kind": "Trích dẫn", "title": "Gửi những người phụ nữ Việt Nam ngày 20/10", "text": "Gửi những người phụ nữ Việt Nam nhân ngày 20 tháng 10.\nCó những người phụ nữ đã quen chăm sóc tất cả mọi người, nhưng đôi khi lại quên hỏi chính mình rằng: hôm nay mình có ổn không?\nBạn có thể là một người mẹ luôn âm thầm hy sinh, một người vợ vun vén gia đình, một người con đang cố gắng báo đáp mẹ cha, hay chỉ đơn giản là một cô gái vẫn từng ngày đi tìm con đường của riêng mình.\nDù đang ở đâu, mong bạn nhớ rằng giá trị của bạn không nằm ở việc phải luôn mạnh mẽ, luôn hoàn hảo hay làm hài lòng tất cả mọi người.\nBạn cũng có quyền mệt mỏi, có quyền nghỉ ngơi và có quyền lựa chọn hạnh phúc cho chính mình.\nNhân ngày Phụ nữ Việt Nam 20 tháng 10, chúc bạn luôn giữ được sự dịu dàng trong trái tim, sự kiên định trong từng bước chân và lòng tin vào những điều tốt đẹp phía trước.\nMong bạn được yêu thương thật nhiều. Và hơn hết, mong bạn đừng bao giờ quên yêu thương chính mình.", "author": "Trạm 1990s", "note": "20/10, phụ nữ Việt Nam, động lực", "mood": "nghi-luc", "folders": ["Chill_100_9x16/02_Hoa", "09_Hanh-trinh-duong-xa", "01_Thien-nhien"], "extra": ["18_Binh-minh-hoang-hon"], "exact": "Videos/Chill_100_9x16/02_Hoa/082_canh-dong-hoa-vang-bat-tan_drone-lien-mach_65s_1080x1920.mp4", "files": null, "url": null, "vnote": "Trích dẫn do Trạm 1990s biên soạn dành cho ngày Phụ nữ Việt Nam 20/10.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 73, "hook": "", "tts": "[softly] Gửi những người phụ nữ Việt Nam nhân ngày 20 tháng 10. [pause]\nCó những người phụ nữ đã quen chăm sóc tất cả mọi người, nhưng đôi khi lại quên hỏi chính mình rằng: hôm nay mình có ổn không? [long pause]\nBạn có thể là một người mẹ luôn âm thầm hy sinh, một người vợ vun vén gia đình, một người con đang cố gắng báo đáp mẹ cha, hay chỉ đơn giản là một cô gái vẫn từng ngày đi tìm con đường của riêng mình. [pause]\nDù đang ở đâu, mong bạn nhớ rằng giá trị của bạn không nằm ở việc phải luôn mạnh mẽ, luôn hoàn hảo hay làm hài lòng tất cả mọi người. [pause]\nBạn cũng có quyền mệt mỏi, có quyền nghỉ ngơi và có quyền lựa chọn hạnh phúc cho chính mình. [pause]\nNhân ngày Phụ nữ Việt Nam 20 tháng 10, chúc bạn luôn giữ được sự dịu dàng trong trái tim, sự kiên định trong từng bước chân và lòng tin vào những điều tốt đẹp phía trước. [pause]\nMong bạn được yêu thương thật nhiều. Và hơn hết, mong bạn đừng bao giờ quên yêu thương chính mình.", "done": {"voice_id": "O4GJDPajhRb6MxWUMf7V", "model": "eleven_v4", "chars": 941, "file": "Long-tieng/elevenlabs/K13_Gui-nhung-nguoi-phu-nu-Viet-Nam-ngay-20-.mp3", "date": "2026-10-20"}, "tpl": "Trích dẫn"}, {"id": "Q051", "kind": "Thơ", "title": "Thương vợ", "text": "Quanh năm buôn bán ở mom sông,\nNuôi đủ năm con với một chồng.\nLặn lội thân cò khi quãng vắng,\nEo sèo mặt nước buổi đò đông.\nMột duyên hai nợ âu đành phận,\nNăm nắng mười mưa dám quản công.\nCha mẹ thói đời ăn ở bạc,\nCó chồng hờ hững cũng như không.", "author": "Tú Xương (1870–1907)", "note": "8 câu thất ngôn bát cú", "mood": "Tình yêu · tình nghĩa", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Th%C6%B0%C6%A1ng_v%E1%BB%A3", "vnote": null, "voice": "Nam", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Có một người vợ tảo tần, đi qua bao nắng mưa mà chẳng một lời than. Tú Xương thương vợ mình như thế này:", "tts": "[softly] Có một người vợ tảo tần, đi qua bao nắng mưa mà chẳng một lời than. Tú Xương thương vợ mình như thế này. [long pause]\nQuanh năm buôn bán ở mom sông, [pause]\nNuôi đủ năm con với một chồng. [pause]\nLặn lội thân cò khi quãng vắng, [pause]\nEo sèo mặt nước buổi đò đông. [pause]\nMột duyên hai nợ âu đành phận, [pause]\nNăm nắng mười mưa dám quản công. [pause]\nCha mẹ thói đời ăn ở bạc, [pause]\nCó chồng hờ hững cũng như không.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 429, "file": "Long-tieng/elevenlabs/Q051_Thuong-vo.mp3", "date": "2026-10-21"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q052", "kind": "Thơ", "title": "Yêu", "text": "Yêu, là chết ở trong lòng một ít,\nVì mấy khi yêu mà chắc được yêu?\nCho rất nhiều, song nhận chẳng bao nhiêu;\nNgười ta phụ, hoặc thờ ơ, chẳng biết.\n\nPhút gần gũi cũng như giờ chia biệt,\nTưởng trăng tàn, hoa tạ với hồn tiêu,\nVì mấy khi yêu mà chắc được yêu!\nYêu, là chết ở trong lòng một ít.\n\nHọ lạc lối giữa u sầu mù mịt,\nNhững người si theo dõi dấu chân yêu;\nVà cảnh đời là sa mạc cô liêu.\nVà tình ái là sợi dây vấn vít.\nYêu, là chết ở trong lòng một ít.", "author": "Xuân Diệu (1916–1985)", "note": "13 câu, tình yêu đơn phương và bất an", "mood": "Tình yêu · tình nghĩa", "folders": ["19_Suong-mu", "Chill_100_9x16/04_Phong_canh", "Chill_100_9x16/03_Suoi"], "extra": ["01_Thien-nhien"], "exact": null, "files": null, "url": "https://www.thivien.net/Xu%C3%A2n-Di%E1%BB%87u/Y%C3%AAu/poem-QKy6LHJMqAcMRcgSw6RXSA", "vnote": null, "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 47, "hook": "Có những tình yêu cho đi rất nhiều, nhưng chẳng biết mình có được yêu lại hay không.", "tts": "[softly] Có những tình yêu cho đi rất nhiều, nhưng chẳng biết mình có được yêu lại hay không. [long pause]\nYêu, [short pause] là chết ở trong lòng một ít, [pause]\nVì mấy khi yêu mà chắc được yêu? [pause]\nCho rất nhiều, [short pause] song nhận chẳng bao nhiêu, [pause]\nNgười ta phụ, [short pause] hoặc thờ ơ, [short pause] chẳng biết. [long pause]\nPhút gần gũi cũng như giờ chia biệt, [pause]\nTưởng trăng tàn, [short pause] hoa tạ với hồn tiêu, [pause]\nVì mấy khi yêu mà chắc được yêu. [pause]\nYêu, [short pause] là chết ở trong lòng một ít. [long pause]\nHọ lạc lối giữa u sầu mù mịt, [pause]\nNhững người si theo dõi dấu chân yêu, [pause]\nVà cảnh đời là sa mạc cô liêu. [pause]\nVà tình ái là sợi dây vấn vít. [pause]\nYêu, [short pause] là chết ở trong lòng một ít.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 763, "file": "Long-tieng/elevenlabs/Q052_Yeu.mp3", "date": "2026-10-21"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q071", "kind": "Thơ", "title": "Người ta", "text": "Những hoang mang không nói được cùng thật thà.\nCó những ngày lòng mình đầy câu hỏi.\nTa muốn bình yên nhưng lại sợ im lặng.\nNên cứ bước đi, dù chưa biết về đâu.", "author": "Nguyễn Phong Việt", "note": "thơ đương đại, chữa lành", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://www.thivien.net/Nguy%E1%BB%85n-Phong-Vi%E1%BB%87t/Ng%C6%B0%E1%BB%9Di-ta/poem-WhM0CypvvGzdnNA2zPI6HA", "vnote": "Bốn dòng đầu là bản diễn ý/sáng tác theo tinh thần tác phẩm; không phải trích nguyên văn.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 22, "hook": "Có những lúc mình chỉ muốn được sống thật với lòng mình", "tts": "[softly] Có những lúc mình chỉ muốn được sống thật với lòng mình. [long pause]\nNhững hoang mang không nói được cùng thật thà. [pause]\nCó những ngày lòng mình đầy câu hỏi. [pause]\nTa muốn bình yên nhưng lại sợ im lặng. [pause]\nNên cứ bước đi, [short pause] dù chưa biết về đâu.", "done": null, "tpl": "Thơ Hoài Cổ"}, {"id": "Q072", "kind": "Thơ", "title": "Đời sợ lắm những ngày im tiếng gió", "text": "Đời sợ lắm những ngày im tiếng gió.\nSợ căn phòng không còn ai hỏi han.\nSợ bình minh đi qua ô cửa nhỏ.\nMà trong lòng vẫn chưa kịp sang trang.", "author": "Nguyễn Phong Việt", "note": "cô
