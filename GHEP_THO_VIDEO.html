pause]\nKẻ đi muôn dặm một mình xa xôi. [pause]\nVầng trăng ai xẻ làm đôi, [pause]\nNửa in gối chiếc, [short pause] nửa soi dặm trường.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 444, "file": "Long-tieng/elevenlabs/Q038_Nguoi-len-ngua-ke-chia-bao.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "Q040", "kind": "Thơ", "title": "Nước non nặng một lời thề", "text": "Nước non nặng một lời thề,\nNước đi đi mãi không về cùng non.\nNhớ lời nguyện nước thề non,\nNước đi chưa lại, non còn đứng không.\nNon cao những ngóng cùng trông,\nSuối khô dòng lệ chờ mong tháng ngày.\nXương mai một nắm hao gầy,\nTóc mây một mái đã đầy tuyết sương!\nTrời tây ngả bóng tà dương,\nCàng phơi vẻ ngọc nét vàng phôi pha.", "author": "Tản Đà (1889–1939), “Thề non nước” (10 câu đầu / 22 câu)", "note": "chờ đợi, thề nguyền", "mood": "doi-cho", "folders": ["02_Bien-song-nuoc", "01_Thien-nhien"], "extra": ["05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Thề_non_nước_(thơ)", "vnote": "Wikisource ghi nhiều dị bản; dùng cách đọc phổ biến trong SGK: lời, Xương mai, Trời tây ngả bóng. Bản Wikisource chép: nhời, Sương mai, Giời tây chiếu bóng. Dấu câu cuối dòng được chuẩn hoá.", "voice": "Nam", "voice_why": "lời người đàn ông", "audio": [], "est": 35, "stem": null, "hook": "Lời thề ngày ấy, người còn nhớ không? Cụ Tản Đà nhắc giùm bạn đây:", "tts": "[softly] Lời thề ngày ấy, người còn nhớ không? Cụ Tản Đà nhắc giùm bạn đây. [long pause]\nNước non nặng một lời thề, [pause]\nNước đi đi mãi không về cùng non. [pause]\nNhớ lời nguyện nước thề non, [pause]\nNước đi chưa lại, [short pause] non còn đứng không. [pause]\nNon cao những ngóng cùng trông, [pause]\nSuối khô dòng lệ chờ mong tháng ngày. [pause]\nXương mai một nắm hao gầy, [pause]\nTóc mây một mái đã đầy tuyết sương. [pause]\nTrời tây ngả bóng tà dương, [pause]\nCàng phơi vẻ ngọc nét vàng phôi pha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 500, "file": "Long-tieng/elevenlabs/Q040_Nuoc-non-nang-mot-loi-the.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q041", "kind": "Thơ", "title": "Sao anh không về chơi thôn Vĩ?", "text": "Sao anh không về chơi thôn Vĩ?\nNhìn nắng hàng cau nắng mới lên,\nVườn ai mướt quá xanh như ngọc,\nLá trúc che ngang mặt chữ điền.\nGió theo lối gió, mây đường mây,\nDòng nước buồn thiu, hoa bắp lay.\nThuyền ai đậu bến sông trăng đó,\nCó chở trăng về kịp tối nay?\nMơ khách đường xa, khách đường xa,\nÁo em trắng quá nhìn không ra...\nỞ đây sương khói mờ nhân ảnh,\nAi biết tình ai có đậm đà?", "author": "Hàn Mặc Tử (1912–1940), “Đây thôn Vĩ Dạ” (đủ 12 câu, 3 khổ)", "note": "sáng sớm, mong nhớ", "mood": "doi-cho", "folders": ["01_Thien-nhien", "18_Binh-minh-hoang-hon"], "extra": ["02_Bien-song-nuoc", "05_Dem-thanh-pho", "17_Tau-hoa-ga"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Đây_thôn_Vĩ_Dạ", "vnote": "Wikisource chép từ SGK Ngữ văn 11, NXB Giáo dục, 2007. “sông trăng” viết thường theo bản này. Dấu câu cuối dòng được chuẩn hoá. Q042, Q043 là khổ 2, 3 của cùng bài (đã gộp).", "voice": "Nữ", "voice_why": "lời người con gái / người phụ nữ", "audio": [], "est": 40, "stem": null, "hook": "Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn:", "tts": "[softly] Có bao giờ bạn muốn hỏi một người: sao không về chơi? Cụ Hàn Mặc Tử đã hỏi thay bạn. [long pause]\nSao anh không về chơi thôn Vĩ? [pause]\nNhìn nắng hàng cau nắng mới lên, [pause]\nVườn ai mướt quá xanh như ngọc, [pause]\nLá trúc che ngang mặt chữ điền. [pause]\nGió theo lối gió, [short pause] mây đường mây, [pause]\nDòng nước buồn thiu, [short pause] hoa bắp lay. [pause]\nThuyền ai đậu bến sông trăng đó, [pause]\nCó chở trăng về kịp tối nay? [pause]\nMơ khách đường xa, [short pause] khách đường xa, [pause]\nÁo em trắng quá nhìn không ra. [pause]\nỞ đây sương khói mờ nhân ảnh, [pause]\nAi biết tình ai có đậm đà?", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 616, "file": "Long-tieng/elevenlabs/Q041_Sao-anh-khong-ve-choi-thon-Vi.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "Q044", "kind": "Thơ", "title": "Thôn Đoài ngồi nhớ thôn Đông", "text": "Thôn Đoài ngồi nhớ thôn Đông,\nMột người chín nhớ mười mong một người.\nGió mưa là bệnh của giời,\nTương tư là bệnh của tôi yêu nàng.\nHai thôn chung lại một làng,\nCớ sao bên ấy chẳng sang bên này?\nNgày qua ngày lại qua ngày,\nLá xanh nhuộm đã thành cây lá vàng.\nBảo rằng cách trở đò giang,\nKhông sang là chẳng đường sang đã đành.\nNhưng đây cách một đầu đình,\nCó xa xôi mấy cho tình xa xôi...", "author": "Nguyễn Bính (1918–1966), “Tương tư” (12 câu đầu / 20 câu)", "note": "tương tư, mưa", "mood": "tinh-yeu", "folders": ["13_Mua-cua-so"], "extra": ["Chill_100_9x16/02_Hoa"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tương_tư", "vnote": "In trong tập “Lỡ bước sang ngang” (Hương Sơn, 1940). Wikisource ghi dị bản “Nắng mưa… trời, trầu”; dùng “Gió mưa… giời”. Dấu câu cuối dòng được chuẩn hoá.", "voice": "Nam", "voice_why": "lời người đàn ông", "audio": [], "est": 40, "stem": null, "hook": "Có ai từng nhớ một người, mà chẳng dám nói thành lời? Nguyễn Bính đã nói giúp bạn rồi đấy:", "tts": "[softly] Có ai từng nhớ một người, mà chẳng dám nói thành lời? Nguyễn Bính đã nói giúp bạn rồi đấy. [long pause]\nThôn Đoài ngồi nhớ thôn Đông, [pause]\nMột người chín nhớ mười mong một người. [pause]\nGió mưa là bệnh của giời, [pause]\nTương tư là bệnh của tôi yêu nàng. [pause]\nHai thôn chung lại một làng, [pause]\nCớ sao bên ấy chẳng sang bên này? [pause]\nNgày qua ngày lại qua ngày, [pause]\nLá xanh nhuộm đã thành cây lá vàng. [pause]\nBảo rằng cách trở đò giang, [pause]\nKhông sang là chẳng đường sang đã đành. [pause]\nNhưng đây cách một đầu đình, [pause]\nCó xa xôi mấy cho tình xa xôi.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 586, "file": "Long-tieng/elevenlabs/Q044_Thon-Doai-ngoi-nho-thon-Dong.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ Nhiều Trang"}, {"id": "S11", "kind": "Có nguồn", "title": "Trời mưa lác đác ruộng dâu", "text": "Trời mưa lác đác ruộng dâu,\nCái nón đội đầu, cái thúng cắp tay;\nBước chân xuống hái dâu nầy,\nNuôi tằm cho lớn, mong ngày ươm tơ.\nThương em chút phận ngây thơ,\nLầm than đã trải, nắng mưa đã từng.\nXa xuôi ai có tỏ chừng?\nGian nan tân khổ, ta đừng quên nhau!", "author": "Dân gian Việt Nam", "note": "Thương người, nắng mưa", "mood": "tinh-yeu", "folders": [], "extra": ["13_Mua-cua-so", "Chill_100_9x16/02_Hoa"], "exact": "Videos/Viet_Nam_Chill_20_40s/Ninh_Binh/19_Ninh_Binh_Nui_va_song_trong_suong_40s_9x16.mp4", "stem": "11_Troi_mua_lac_dac_ruong_dau", "source": "https://vi.wikisource.org/wiki/Theo_tục_ngữ_phong_dao,_xét_về_sự_sanh_hoạt_của_phụ_nữ_nước_ta", "voice": "Nữ", "voice_why": "lời người con gái / người phụ nữ", "audio": [], "est": 30, "url": "https://vi.wikisource.org/wiki/Theo_tục_ngữ_phong_dao,_xét_về_sự_sanh_hoạt_của_phụ_nữ_nước_ta", "files": null, "vnote": null, "hook": "Các cụ nhà ta không hứa chuyện giàu sang, mà chỉ dặn nhau: gian nan rồi, đừng quên nhau!", "tts": "[softly] Các cụ nhà ta không hứa chuyện giàu sang, mà chỉ dặn nhau: gian nan rồi, đừng quên nhau. [long pause]\nTrời mưa lác đác ruộng dâu, [pause]\nCái nón đội đầu, [short pause] cái thúng cắp tay, [pause]\nBước chân xuống hái dâu nầy, [pause]\nNuôi tằm cho lớn, [short pause] mong ngày ươm tơ. [pause]\nThương em chút phận ngây thơ, [pause]\nLầm than đã trải, [short pause] nắng mưa đã từng. [pause]\nXa xuôi ai có tỏ chừng? [pause]\nGian nan tân khổ, [short pause] ta đừng quên nhau.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 478, "file": "Long-tieng/elevenlabs/S11_Troi-mua-lac-dac-ruong-dau.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L10", "kind": "Thơ", "title": "Kiều: đêm thề nguyền", "text": "Vầng trăng vằng vặc giữa trời,\nĐinh ninh hai mặt một lời song song.\nTóc tơ căn vặn tấc lòng,\nTrăm năm tạc một chữ đồng đến xương.\nChén hà sánh giọng quỳnh tương,\nDải là hương lộn bình gương bóng lồng.\nSinh rằng: Gió mát trăng trong,\nBấy lâu nay một chút lòng chưa cam.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "Kim – Kiều thề nguyền", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng:", "tts": "[softly] Các cụ nhà ta không thề qua tin nhắn, mà các cụ thề dưới vầng trăng. [long pause]\nVầng trăng vằng vặc giữa trời, [pause]\nĐinh ninh hai mặt một lời song song. [pause]\nTóc tơ căn vặn tấc lòng, [pause]\nTrăm năm tạc một chữ đồng đến xương. [pause]\nChén hà sánh giọng quỳnh tương, [pause]\nDải là hương lộn bình gương bóng lồng. [pause]\nSinh rằng: Gió mát trăng trong, [pause]\nBấy lâu nay một chút lòng chưa cam.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 415, "file": "Long-tieng/elevenlabs/L10_Kieu-dem-the-nguyen.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "L11", "kind": "Thơ", "title": "Kiều: lần đầu gặp Kim Trọng", "text": "Người quốc sắc, kẻ thiên tài,\nTình trong như đã, mặt ngoài còn e.\nChập chờn cơn tỉnh cơn mê.\nRốn ngồi chẳng tiện, dứt về chỉn khôn.\nBóng tà như giục cơn buồn,\nKhách đà lên ngựa, người còn nghé theo.\nDưới cầu nước chảy trong veo,\nBên cầu tơ liễu bóng chiều thướt tha.", "author": "Nguyễn Du (1766–1820), Truyện Kiều", "note": "gặp là nhớ, hợp hook \"một ánh nhìn\"", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Truyện_Kiều", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Cả hai", "voice_why": "lời kể, tự sự", "audio": [], "est": 30, "hook": "Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này:", "tts": "[softly] Có những tình yêu, chỉ cần một ánh nhìn, là đủ nhớ cả đời. Cụ Nguyễn Du kể lại thế này. [long pause]\nNgười quốc sắc, [short pause] kẻ thiên tài, [pause]\nTình trong như đã, [short pause] mặt ngoài còn e. [pause]\nChập chờn cơn tỉnh cơn mê. [pause]\nRốn ngồi chẳng tiện, [short pause] dứt về chỉn khôn. [pause]\nBóng tà như giục cơn buồn, [pause]\nKhách đà lên ngựa, [short pause] người còn nghé theo. [pause]\nDưới cầu nước chảy trong veo, [pause]\nBên cầu tơ liễu bóng chiều thướt tha.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 488, "file": "Long-tieng/elevenlabs/L11_Kieu-lan-dau-gap-Kim-Trong.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C02", "kind": "Ca dao", "title": "Vào vườn hái quả cau xanh", "text": "Vào vườn hái quả cau xanh,\nBổ ra làm sáu, mời anh xơi trầu.\nTrầu này têm những vôi tàu,\nGiữa đệm cát cánh, hai đầu quế cay.\nTrầu này ăn thiệt là say,\nDù mặn, dù nhạt, dù cay, dù nồng.\nDù chăng nên đạo vợ chồng.\nXơi dăm ba miếng kẻo lòng nhớ thương!", "author": "Ca dao (Wikisource)", "note": "8 dòng", "mood": "tinh-yeu", "folders": ["Chill_100_9x16/02_Hoa", "02_Bien-song-nuoc"], "extra": ["13_Mua-cua-so", "18_Binh-minh-hoang-hon"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Con_gái_ngỏ_ý_với_con_trai", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương:", "tts": "[softly] Các cụ nhà ta không nhắn \"anh ăn cơm chưa\", mà têm sẵn miếng trầu mời người thương. [long pause]\nVào vườn hái quả cau xanh, [pause]\nBổ ra làm sáu, [short pause] mời anh xơi trầu. [pause]\nTrầu này têm những vôi tàu, [pause]\nGiữa đệm cát cánh, [short pause] hai đầu quế cay. [pause]\nTrầu này ăn thiệt là say, [pause]\nDù mặn, [short pause] dù nhạt, [short pause] dù cay, [short pause] dù nồng. [pause]\nDù chăng nên đạo vợ chồng. [pause]\nXơi dăm ba miếng kẻo lòng nhớ thương.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 480, "file": "Long-tieng/elevenlabs/C02_Vao-vuon-hai-qua-cau-xanh.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C03", "kind": "Ca dao", "title": "Trèo lên cây bưởi hái hoa", "text": "Trèo lên cây bưởi hái hoa,\nBước xuống vườn cà hái nụ tầm-xuân.\nBa đồng một mớ trầu cay,\nSao anh chẳng hỏi những ngày còn không?\nBây giờ em đã có chồng,\nNhư chim vào lồng, như cá cắn câu.\nCá cắn câu, biết đâu mà gỡ;\nChim vào lồng, biết thuở nào ra!", "author": "Ca dao (Wikisource)", "note": "đã bỏ một dòng khuyết trên trang nguồn", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Tiếc_sự_biết_nhau_quá_chậm", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 30, "hook": "Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này:", "tts": "[softly] Có những người, gặp nhau lúc đã muộn màng. Các cụ nhà ta tiếc thế này. [long pause]\nTrèo lên cây bưởi hái hoa, [pause]\nBước xuống vườn cà hái nụ tầm-xuân. [pause]\nBa đồng một mớ trầu cay, [pause]\nSao anh chẳng hỏi những ngày còn không? [pause]\nBây giờ em đã có chồng, [pause]\nNhư chim vào lồng, [short pause] như cá cắn câu. [pause]\nCá cắn câu, [short pause] biết đâu mà gỡ, [pause]\nChim vào lồng, [short pause] biết thuở nào ra.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 438, "file": "Long-tieng/elevenlabs/C03_Treo-len-cay-buoi-hai-hoa.mp3", "date": "2026-10-16"}, "tpl": "Chạy Chữ 2 Trang"}, {"id": "C04", "kind": "Ca dao", "title": "Đôi duyên ta như loan với phượng", "text": "Đôi duyên ta như loan với phượng,\nNỡ lòng nào để phượng lìa cây.\nMuốn cho có đó có đây,\nAi làm nên nỗi nước này, chàng ôi!\nThà rằng chẳng biết thì thôi,\nBiết chi gối chiếc lẻ-loi thêm phiền.", "author": "Ca dao (Wikisource)", "note": "6 dòng", "mood": "doi-cho", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "17_Tau-hoa-ga"], "extra": ["05_Dem-thanh-pho", "Chill_100_9x16/01_Mua", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": "https://vi.wikisource.org/wiki/Nỗi_ly_biệt", "vnote": "Bản chép Wikisource, có thể có dị bản chữ. Nên đối chiếu trước khi đăng.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 25, "hook": "Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này:", "tts": "[softly] Thà không biết nhau còn hơn biết rồi phải xa. Các cụ nhà ta nói thế này. [long pause]\nĐôi duyên ta như loan với phượng, [pause]\nNỡ lòng nào để phượng lìa cây. [pause]\nMuốn cho có đó có đây, [pause]\nAi làm nên nỗi nước này, [short pause] chàng ôi. [pause]\nThà rằng chẳng biết thì thôi, [pause]\nBiết chi gối chiếc lẻ-loi thêm phiền.", "done": {"voice_id": "qn4pQo7kIjvZ1a7SowZE", "model": "eleven_v4", "chars": 339, "file": "Long-tieng/elevenlabs/C04_Doi-duyen-ta-nhu-loan-voi-phuong.mp3", "date": "2026-10-16"}, "tpl": "Thơ Hoài Cổ"}, {"id": "K02", "kind": "Trích dẫn", "title": "Dịu dàng với chính mình", "text": "Người ta thường khen bạn mạnh mẽ, nhưng ít ai biết bạn đã phải trải qua những đêm dài như thế nào.\nCó những nỗi buồn không thể kể, có những giọt nước mắt phải tự mình lau.\nMong rằng sau tất cả, bạn sẽ học được cách dịu dàng với chính mình.\nHãy ôm lấy bản thân như cách bạn vẫn ôm người mình thương.\nBạn đã đi một quãng đường rất dài, và bạn xứng đáng được nghỉ ngơi.", "author": "Không rõ", "note": "chữa lành, dịu dàng", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 32, "hook": "", "tts": "[softly] Người ta thường khen bạn mạnh mẽ, nhưng ít ai biết bạn đã phải trải qua những đêm dài như thế nào. [pause]\nCó những nỗi buồn không thể kể, có những giọt nước mắt phải tự mình lau. [long pause]\nMong rằng sau tất cả, bạn sẽ học được cách dịu dàng với chính mình. [pause]\nHãy ôm lấy bản thân như cách bạn vẫn ôm người mình thương. [pause]\nBạn đã đi một quãng đường rất dài, và bạn xứng đáng được nghỉ ngơi.", "done": {"voice_id": "O4GJDPajhRb6MxWUMf7V", "model": "eleven_v4", "chars": 412, "file": "Long-tieng/elevenlabs/K02_Diu-dang-voi-chinh-minh.mp3", "date": "2026-10-19"}, "tpl": "Trích dẫn"}, {"id": "K01", "kind": "Trích dẫn", "title": "Một khoảng lặng để sống thật", "text": "Có những ngày, bạn chẳng muốn cố gắng thêm điều gì nữa.\nChỉ muốn ngồi yên, không phải giải thích, không phải gồng mình mạnh mẽ.\nVà điều đó cũng chẳng sao cả.\nBởi đôi khi, điều chúng ta cần nhất không phải là một lời khuyên, mà là một khoảng lặng để được sống thật với cảm xúc của mình.\nVậy nên hôm nay, nếu muốn nghỉ ngơi, hãy cứ nghỉ, ngày mai ta sẽ lại bước đi nhẹ nhàng hơn.", "author": "Không rõ", "note": "chữa lành, khoảng lặng", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Có những ngày, bạn chẳng muốn cố gắng thêm điều gì nữa. [pause]\nChỉ muốn ngồi yên, không phải giải thích, không phải gồng mình mạnh mẽ. [long pause]\nVà điều đó cũng chẳng sao cả. [pause]\nBởi đôi khi, điều chúng ta cần nhất không phải là một lời khuyên, mà là một khoảng lặng để được sống thật với cảm xúc của mình. [pause]\nVậy nên hôm nay, nếu muốn nghỉ ngơi, hãy cứ nghỉ, ngày mai ta sẽ lại bước đi nhẹ nhàng hơn.", "done": null, "tpl": "Trích dẫn"}, {"id": "K03", "kind": "Trích dẫn", "title": "Bước nhỏ cũng đủ qua ngày giông bão", "text": "Nếu hôm nay bạn thấy mình chẳng làm được điều gì đáng kể, hãy nhớ rằng có những ngày, chỉ riêng việc thức dậy và tiếp tục sống đã là một sự cố gắng.\nKhông phải bước chân nào cũng cần thật dài.\nCó những bước rất nhỏ, nhưng cũng đủ đưa ta qua một ngày giông bão.\nVậy nên đừng tự trách mình nữa.\nHôm nay bạn đã làm đủ rồi, ngày mai hãy cứ bước tiếp, thật chậm cũng được.", "author": "Không rõ", "note": "chữa lành, tiếp tục sống", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Nếu hôm nay bạn thấy mình chẳng làm được điều gì đáng kể, hãy nhớ rằng có những ngày, chỉ riêng việc thức dậy và tiếp tục sống đã là một sự cố gắng. [pause]\nKhông phải bước chân nào cũng cần thật dài. [long pause]\nCó những bước rất nhỏ, nhưng cũng đủ đưa ta qua một ngày giông bão. [pause]\nVậy nên đừng tự trách mình nữa. [pause]\nHôm nay bạn đã làm đủ rồi, ngày mai hãy cứ bước tiếp, thật chậm cũng được.", "done": null, "tpl": "Trích dẫn"}, {"id": "K04", "kind": "Trích dẫn", "title": "Không có mùa mưa nào kéo dài mãi", "text": "Cuộc đời không phải ngày nào cũng có nắng.\nSẽ có những cơn mưa đến bất chợt, khiến lòng người ướt lạnh.\nNhưng bạn biết không, không có mùa mưa nào kéo dài mãi mãi.\nRồi sẽ đến một buổi sáng, bạn thức dậy và nhận ra lòng mình đã nhẹ hơn ngày hôm qua rất nhiều.\nCho đến lúc ấy, cứ để mưa rơi, cứ để lòng được buồn.\nBầu trời nào rồi cũng sáng, và bạn cũng sẽ như vậy.", "author": "Không rõ", "note": "chữa lành, sau cơn mưa", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 33, "hook": "", "tts": "[softly] Cuộc đời không phải ngày nào cũng có nắng. [pause]\nSẽ có những cơn mưa đến bất chợt, khiến lòng người ướt lạnh. [long pause]\nNhưng bạn biết không, không có mùa mưa nào kéo dài mãi mãi. [pause]\nRồi sẽ đến một buổi sáng, bạn thức dậy và nhận ra lòng mình đã nhẹ hơn ngày hôm qua rất nhiều. [pause]\nCho đến lúc ấy, cứ để mưa rơi, cứ để lòng được buồn. [pause]\nBầu trời nào rồi cũng sáng, và bạn cũng sẽ như vậy.", "done": null, "tpl": "Trích dẫn"}, {"id": "K05", "kind": "Trích dẫn", "title": "Thương lấy chính mình", "text": "Có những người, những chuyện, chúng ta đã từng nghĩ sẽ giữ được cả đời.\nNhưng rồi năm tháng dạy ta hiểu rằng, không phải điều gì đẹp đẽ cũng có thể ở lại.\nBuông tay đôi khi không phải vì hết thương, mà vì ta đã đến lúc phải thương lấy chính mình.\nNhững điều đẹp đẽ ấy vẫn còn trong ký ức, chỉ là không còn ở bên ta.\nHãy cảm ơn vì đã từng gặp nhau, rồi nhẹ nhàng đi tiếp.", "author": "Không rõ", "note": "chữa lành, buông tay", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 34, "hook": "", "tts": "[softly] Có những người, những chuyện, chúng ta đã từng nghĩ sẽ giữ được cả đời. [pause]\nNhưng rồi năm tháng dạy ta hiểu rằng, không phải điều gì đẹp đẽ cũng có thể ở lại. [long pause]\nBuông tay đôi khi không phải vì hết thương, mà vì ta đã đến lúc phải thương lấy chính mình. [pause]\nNhững điều đẹp đẽ ấy vẫn còn trong ký ức, chỉ là không còn ở bên ta. [pause]\nHãy cảm ơn vì đã từng gặp nhau, rồi nhẹ nhàng đi tiếp.", "done": {"voice_id": "O4GJDPajhRb6MxWUMf7V", "model": "eleven_v4", "chars": 416, "file": "Long-tieng/elevenlabs/K05_Thuong-lay-chinh-minh.mp3", "date": "2026-10-19"}, "tpl": "Trích dẫn"}, {"id": "K06", "kind": "Trích dẫn", "title": "Cảm ơn vì đã không bỏ rơi chính mình", "text": "Cảm ơn bạn vì đã không bỏ rơi chính mình trong những ngày tăm tối nhất.\nCảm ơn vì dù từng thất vọng, tổn thương, bạn vẫn chọn sống tử tế.\nMong những tháng ngày phía trước sẽ dịu dàng hơn, và mong bạn tìm được hạnh phúc mà mình luôn xứng đáng có được.\nNgủ ngon nhé, người vẫn luôn cố gắng.\nNgày mai, bạn sẽ lại là một phiên bản bình yên hơn của chính mình.", "author": "Không rõ", "note": "chữa lành, lời cảm ơn", "mood": "tung-trai", "folders": ["14_Co-don-tram-lang", "13_Mua-cua-so", "05_Dem-thanh-pho"], "extra": ["16_Nguoi-gia-ky-uc", "Chill_100_9x16/05_Co_don"], "exact": null, "files": null, "url": null, "vnote": "Trích dẫn do bạn cung cấp, chưa rõ tác giả.", "voice": "Nữ", "voice_why": "giọng đọc gợi ý", "audio": [], "est": 31, "hook": "", "tts": "[softly] Cảm ơn bạn vì đã không bỏ rơi chính mình trong những ngày tăm tối nhất. [pause]\nCảm ơn vì dù từng thất vọng, tổn thương, bạn vẫn chọn sống tử tế. [long pause]\nMong những tháng ngày phía trước sẽ dịu dàng hơn, và mong bạn tìm được hạnh phúc mà mình luôn xứng đáng có được. [pause]\nNgủ ngon nhé, người vẫn luôn cố gắng. [pause]\nNgày mai, bạn sẽ lại là một phiên bản bình yên hơn của chính mình.", "done": null, "tpl": "Trích dẫn"}, {"id": "K07", "kind": "Trích dẫn", "title": "Bình yên bắt đầu từ cách ta nhìn", "text": "Điều làm ta xao động nhiều khi không phải là sự việc, mà là cách ta nhìn sự việc ấy.\nKhi không thể thay đổi điều đang xảy ra, ta vẫn có th  chips();const q=$('#q').value.toLowerCase(),un=$('#unused').checked;
 const ps=(tab=='bo'?D.combos:D.poems).filter(p=>(tab!='dub'||p.done)&&(!mood||p.mood==mood)&&(!kind||p.kind.startsWith(kind))&&(!voice||p.voice==voice)&&(!$('#long30').checked||p.est>=28)&&(tab=='bo'||!un||!used[p.id])&&(!q||(p.text+p.title+p.note).toLowerCase().includes(q))).sort((x,y)=>(y.done?1:0)-(x.done?1:0));
 $('#cnt').textContent=ps.length+(tab=='bo'?' bộ (mỗi bộ ghép nhiều bài ngắn cùng mood + cùng giọng, thời lượng = giọng đọc thật nếu đã lồng tiếng, nếu chưa thì ước tính ~3 âm tiết/giây, +10s mở đầu tự nghĩ)':' bài (≈ thời lượng video = giọng đọc + 10s mở đầu tự nghĩ)');
 $('#list').innerHTML=ps.map(p=>{
  let v='';
  if(p.exact){const rel=p.exact;v+=`<div><small>Clip đã gắn sẵn:</small> <a href="#" data-copy="${esc(rel)}">${esc(rel)}</a> <button class="act" data-open="${esc(rel)}">▶ mở</button></div>
   <div><small>Văn bản / SRT:</small> <a href="Thơ/Tho_CaDao_Co_Nguon/Van_ban/${p.stem}.txt" target="_blank">txt</a> · <a href="Thơ/Tho_CaDao_Co_Nguon/Phu_de_SRT/${p.stem}.srt" target="_blank">srt</a></div>`}
  const fl=p.folders.map(f=>`<button class="f" data-f="${f}" data-p="${p.id}">${f} (${clipList(f).length})</button>`).join('');
  const ex=p.extra.map(f=>`<button class="f x" data-f="${f}" data-p="${p.id}">${f.replace('Chill_100_9x16/','Chill/')} (${clipList(f).length})</button>`).join('');
  if(fl)v+=`<div><small>Thư mục video gợi ý:</small> ${fl}</div>`;
  if(ex)v+=`<div><small>${p.exact?'Hoặc chọn clip khác cùng mood:':'Thêm cùng mood:'}</small> ${ex}</div>`;
  const ms=musicFor(p.mood);
  if(ms.length)v+=`<div><small>Nhạc nền hợp mood (${ms.length} bài):</small> <button class="act" data-music="${p.id}">🎵 Chọn nhạc ngẫu nhiên</button> <button class="f" data-all="${p.id}">xem tất cả</button></div><div id="m_${p.id}"></div>`;
  v+=`<div class="row"><button class="act" data-rand="${p.id}">🎲 Chọn clip ngẫu nhiên</button></div><div id="o_${p.id}"></div>`;
  return `<div class="card${used[p.id]?' used':''}"><div class="hd"><span class="id">${p.id}</span>${p.done?`<span class="tag" style="background:#2f7d4f;color:#fff">✅ Đã lồng tiếng</span>`:''}${p.tpl?`<span class="tag" style="background:transparent;border:1px solid var(--acc)">📄 ${p.tpl}</span>`:''}<span>${p.kind}</span><span class="tag">${D.moods[p.mood]}</span><span class="tag">🎙 ${p.voice}</span><span class="tag" style="background:${p.est>=28?'var(--accbg)':'transparent'};border:1px solid var(--acc)">≈ ${p.est}s${p.est<28?' (ngắn)':''}</span><span>${esc(p.note)}</span><label style="margin-left:auto"><input type="checkbox" data-u="${p.id}"${used[p.id]?' checked':''}> đã làm video</label></div>
  ${dubControls(p)}${FB_TITLES[p.id]?`<div class="tx" style="font-size:15px;color:var(--acc);margin-bottom:6px">📘 Tiêu đề Facebook: <b>${esc(FB_TITLES[p.id])}</b> · <a href="#" data-copy-text="${esc(FB_TITLES[p.id])}">sao chép</a></div>`:''}${p.hook?`<div class="tx" style="font-size:15px;color:var(--acc);margin-bottom:2px">🎬 Mở đầu (≈10s): ${esc(p.hook)}</div>`:''}<div class="tx">${esc(p.text)}</div>${p.tts?`<div class="au"><a href="#" data-copy="${esc(p.tts)}">sao chép kịch bản ElevenLabs (mở đầu + thơ)</a></div>`:''}<div class="au">— ${esc(p.author)}${p.items?' (các mã trong tab Thơ)':''}${p.url?` · <a href="${p.url}" target="_blank">nguồn</a>`:''}</div>${p.vnote?`<div class="au" style="font-size:12px">${esc(p.vnote)}</div>`:''}<div class="au">Giọng đọc gợi ý: <b>${p.voice}</b> — ${esc(p.voice_why)}</div><div class="vd">${(p.audio||[]).map(a=>`<div class="mu"><b>🔊 ${esc(a.voice)}</b><small>${a.dur}s</small><audio controls preload="none" src="${encodeURI(a.file)}"></audio> <a href="#" data-copy="${esc(a.file)}">sao chép đường dẫn</a></div>`).join('')}${v}</div></div>`}).join('');
}
function showClips(pid,f){
 const o=$('#o_'+pid);o.innerHTML=`<div class="cl">${clipList(f).map(c=>`<div data-copy="Videos/${esc(f)}/${esc(c)}">${esc(c)}</div>`).join('')}</div>`}
function pick(p){
 const pool=[];p.folders.concat(p.extra.length&&!p.folders.length?p.extra:[]).forEach(f=>clipList(f).forEach(c=>pool.push('Videos/'+f+'/'+c)));
 if(p.exact&&!pool.length)pool.push(p.exact);
 if(p.exact)p.extra.forEach(f=>clipList(f).forEach(c=>pool.push('Videos/'+f+'/'+c)));
 const r=pool[Math.floor(Math.random()*pool.length)];
 $('#o_'+p.id).innerHTML=`<div class="pick">${esc(r)}</div>`;copy(r)}
async function copy(rel){try{if(!BASE){const j=await (await fetch('/api/root')).json();BASE=j.root.replace(/\/$/,'')+'/'}await navigator.clipboard.writeText(BASE+rel)}catch(e){}}
function copyText(value){try{navigator.clipboard.writeText(value)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-k],[data-f],[data-rand],[data-copy],[data-copy-text],[data-open],[data-t],[data-v],[data-play],[data-music],[data-all],[data-dub]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;mood='';kind='';voice='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#kinds').style.display=$('#voices').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#unusedl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#longl').style.display=(tab=='tho'||tab=='dub')?'':'none';$('#kinds').style.display=$('#voices').style.display=((tab=='tho'||tab=='dub')||tab=='bo')?'':'none';if(tab=='bo')$('#kinds').style.display='none';render()}
 else if(t.dataset.v){voice=voice==t.dataset.v?'':t.dataset.v;render()}
 else if(t.dataset.play)play(t.dataset.play,t.dataset.pk);
 else if(t.dataset.music){const p=findP(p=>p.id==t.dataset.music),ts=musicFor(p.mood),x=ts[Math.floor(Math.random()*ts.length)];$('#m_'+p.id).innerHTML=musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`}
 else if(t.dataset.all){const p=findP(p=>p.id==t.dataset.all);$('#m_'+p.id).innerHTML=musicFor(p.mood).map(x=>musicRow(x,p.id+'_'+x.key)+`<div id="a_${p.id}_${x.key}"></div>`).join('')}
 else if(t.dataset.m!==undefined){mood=t.dataset.m;render()}
 else if(t.dataset.k){kind=kind==t.dataset.k?'':t.dataset.k;render()}
 else if(t.dataset.f)showClips(t.dataset.p,t.dataset.f);
 else if(t.dataset.rand)pick(findP(p=>p.id==t.dataset.rand));
 else if(t.dataset.dub){e.preventDefault();startDub(t.dataset.dub,t)}
 else if(t.dataset.open)window.open(encodeURI(t.dataset.open));
 else if(t.dataset.copy){e.preventDefault();copy(t.dataset.copy);t.style.color='var(--acc)'}
 else if(t.dataset.copyText){e.preventDefault();copyText(t.dataset.copyText);t.style.color='var(--acc)'}});
document.addEventListener('change',e=>{if(e.target.dataset.u){used[e.target.dataset.u]=e.target.checked;save();render()}});
$('#q').oninput=render;$('#unused').onchange=render;$('#long30').onchange=render;render();
</script><script src="tao-video.js?v=20261020-image-template-v2"></script></body></html>
